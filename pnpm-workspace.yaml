packages:
  - 'packages/*'
  # The TiddlyWiki5 engine — our fork (amorphous-dreams/TiddlyWiki5) vendored as a submodule, replacing
  # the npm pin so re-genesis builds TW5 core from source + we can branch/PR upstream for deep re-writes.
  - 'TiddlyWiki5'
  # Top-level e2e harness — staged/live instance targeting (tests/TEST-ARCHITECTURE.md)
  - 'tests'
  # Corpus bag targets — each maps to one Automerge doc
  - 'elyncia'
  - 'ftls'
  - 'sdm'
  - 'wtf'
allowBuilds:
  cbor-extract: true
  esbuild: true
  tree-sitter-cli: true

# ONE AUTOMERGE, ONE WASM MODULE. `automerge-repo` declares `^3.2.6` and resolved its own 3.4.0 beside
# our 3.4.1, standing two copies of the engine — two wasm instances to compile at boot, on the path a
# cold found already races. The override collapses them to the version this workspace pins.
#
# pnpm 11 reads settings HERE, not from package.json — a block left there resolves nothing and reads
# as applied.
overrides:
  "@automerge/automerge": "3.4.1"

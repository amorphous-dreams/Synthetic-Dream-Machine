# docker-compose.swarm-ws.yml — the DEPLOYED swarm over LIVE-WS (the same shore, WS form).
# Same vessels, same ceremony as docker-compose.swarm.yml — but the membership channel is
# now a live WebSocket RELAY container the vessels dial, NOT a shared volume. The shore made
# the swap a one-env change (LAR_SWARM_RELAY instead of LAR_SWARM_DIR).
#
#   relay    (relay-node)  a dumb broadcast membership relay on :8090
#   founder  dials ws://relay:8090, founds, opens each party's dwelling, verifies each PRESENTED admit on ask
#   vessel-b / vessel-c    dial ws://relay:8090, offer card → await admit → present it → await the verdict
#
# Run:     docker compose -f docker-compose.swarm-ws.yml up --abort-on-container-exit --exit-code-from founder
# Witness: the founder's exit code, and its log "held=2/2" (no roster stands; each party verifies on ask)
# Down:    docker compose -f docker-compose.swarm-ws.yml down -v

name: dreamnet-swarm-ws

# Node services require the product image digest in LARES_HARNESS_IMAGE.

x-vessel: &vessel
  image: "${LARES_HARNESS_IMAGE:?name the built image by digest — tools/harness-image.sh prints it}"
  networks: [swarm]
  restart: "no"
  entrypoint: ["node", "packages/lararium-node/dist/probes/swarm-node.js"]

services:
  relay:
    image: "${LARES_HARNESS_IMAGE:?name the built image by digest — tools/harness-image.sh prints it}"
    volumes:
      - "swarm-relay-state:/state"
    networks: [swarm]
    restart: "no"
    environment:
      LAR_ROOT: "/state"
      LAR_RELAY_PORT: "8090"
    entrypoint: ["node", "packages/lararium-node/dist/probes/relay-node.js"]

  founder:
    <<: *vessel
    volumes:
      - "swarm-ws-founder-state:/state"
    environment:
      LAR_SWARM_ROLE:   "founder"
      LAR_ROOT:         "/state"
      LAR_SWARM_RELAY:  "ws://relay:8090"
      LAR_SWARM_ID:     "founder"
      LAR_SWARM_SEED:   "f0"
      LAR_SWARM_EXPECT: "2"
    depends_on: [relay]

  vessel-b:
    <<: *vessel
    volumes:
      - "swarm-ws-vessel-b-state:/state"
    environment:
      LAR_SWARM_ROLE:  "joiner"
      LAR_ROOT:        "/state"
      LAR_SWARM_RELAY: "ws://relay:8090"
      LAR_SWARM_ID:    "vessel-B"
      LAR_SWARM_SEED:  "b0"
    depends_on: [relay]

  vessel-c:
    <<: *vessel
    volumes:
      - "swarm-ws-vessel-c-state:/state"
    environment:
      LAR_SWARM_ROLE:  "joiner"
      LAR_ROOT:        "/state"
      LAR_SWARM_RELAY: "ws://relay:8090"
      LAR_SWARM_ID:    "vessel-C"
      LAR_SWARM_SEED:  "c0"
    depends_on: [relay]

volumes:
  swarm-relay-state:
  swarm-ws-founder-state:
  swarm-ws-vessel-b-state:
  swarm-ws-vessel-c-state:

networks:
  swarm:
    driver: bridge

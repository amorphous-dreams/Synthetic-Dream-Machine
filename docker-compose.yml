# Lararium — Docker Compose
#
# Profiles:
#   dev        — tsx watch mode, full monorepo mounted rw, no build step
#   qa         — built serve image, ports exposed for browser QA and VSCode sessions
#   prod       — built serve image, lares/ read-only, hardened
#   mcp-dev    — MCP stdio, tsx watch
#   mcp-qa     — MCP stdio, built image, ports exposed
#   mcp-prod   — MCP stdio, built image, lares/ read-only
#   qa-smoke   — stdio smoke tests against built image
#
# Usage:
#   make docker-dev          # hot-reload serve + web surface
#   make docker-qa           # QA browser test on :4321
#   make docker-prod         # production serve
#   docker compose --profile mcp-qa up
#
# Auth env vars (all optional):
#   GITHUB_CLIENT_ID         GitHub OAuth App client id  (web flow, browser users)
#   GITHUB_CLIENT_SECRET     GitHub OAuth App client secret
#   gh CLI is used automatically on the host (make serve-dev / make serve).
#   gh CLI is NOT available inside containers — Bluesky OAuth is primary there.
#   Bluesky AT Proto OAuth requires no server-side config (client-side PKCE+DPoP).

x-auth-env: &auth-env
  GITHUB_CLIENT_ID:     ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}

x-serve-volumes-rw: &serve-volumes-rw
  - ./lares:/app/lares:rw
  - lararium-data:/app/.lararium-data

x-serve-volumes-ro: &serve-volumes-ro
  - ./lares:/app/lares:ro
  - lararium-data:/app/.lararium-data

x-vessel-data-env: &vessel-data-env
  # The named volume is the vessel's durable XDG data home. The founder and
  # server therefore resolve the same daemon doc without borrowing host state.
  XDG_DATA_HOME: /app/.lararium-data
  XDG_STATE_HOME: /app/.lararium-data/state
  XDG_CACHE_HOME: /app/.lararium-data/cache
  XDG_CONFIG_HOME: /app/.lararium-data/config

services:

  # ─── qa-founder — explicit founding ceremony for the fresh QA volume
  # This is test arrangement, not an implicit production side effect. `up`
  # waits for its receipt before the direct Node peer is allowed to boot.
  lararium-qa-founder:
    profiles: [qa]
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    volumes: *serve-volumes-rw
    environment:
      NODE_ENV: qa
      <<: *vessel-data-env
      # The image's checked-out corpus is the deliberate local QA root; the
      # vessel state remains isolated in the XDG volume above.
      LAR_DEV_REPO_ROOT: "1"
      LAR_PRONAOS_FOUNDER_RECEIPT: /app/.lararium-data/pronaos-founder-receipt.json
    command: ["sh", "-ec", "node packages/lares-cli/dist/src/bin/lares.js vessel found --skip-build; test -s /app/.lararium-data/lares/vessel/social-bootstrap.json; printf '%s\\n' '{\"kind\":\"pronaos-founder\",\"bootstrap\":\"/app/.lararium-data/lares/vessel/social-bootstrap.json\"}' > /app/.lararium-data/pronaos-founder-receipt.json"]

  # ─── dev — hot-reload node peer (tsx watch, full source mounted) ────────────
  lararium-dev:
    profiles: [dev]
    image: node:24-slim
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      LAR_PORT: "4321"
      <<: *auth-env
    command: >
      sh -c "npm install -g pnpm &&
             pnpm install &&
             pnpm -r build &&
             node --import tsx/esm --watch packages/lararium-node/src/main.ts"
    ports:
      - "4321:4321"

  # ─── qa — built Node vessel + explicit Pronaos composition, browser QA on :4321
  lararium-qa:
    profiles: [qa]
    build:
      context: .
      dockerfile: Dockerfile
      target: serve
    volumes: *serve-volumes-rw
    depends_on:
      lararium-qa-founder:
        condition: service_completed_successfully
    environment:
      NODE_ENV: qa
      <<: *vessel-data-env
      # QA's direct Node composition uses the same checked-out corpus as its
      # founder while keeping durable vessel state in the named volume.
      LAR_DEV_REPO_ROOT: "1"
      # The Web shore and its finite receipt are separate explicit inputs. This
      # profile exercises Node's composed Pronaos; it remains a direct Node vessel.
      LAR_PRONAOS_WEB_ROOT: /app/packages/lararium-web/dist
      LAR_PRONAOS_ARTIFACT_RECORD: /app/pronaos-build/pronaos-artifact.json
      # This direct Node profile serves Pronaos, health, Oracle, and the relay
      # under one explicitly declared HTTP origin; relay reach is still named
      # separately by LAR_PUBLIC_URL when an operator supplies it.
      LAR_SAME_ORIGIN: "true"
      GITHUB_CLIENT_ID:     ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    ports:
      - "4321:4321"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4321/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── prod — direct Node vessel, lares/ read-only, port policy unchanged ────
  lararium-prod:
    profiles: [prod]
    build:
      context: .
      dockerfile: Dockerfile
      target: serve
    volumes: *serve-volumes-ro
    environment:
      NODE_ENV: production
      <<: *vessel-data-env
      # Production carries the same explicit finite Pronaos inputs as QA.
      # Copying the artifact alone never widens Node's route ownership.
      LAR_PRONAOS_WEB_ROOT: /app/packages/lararium-web/dist
      LAR_PRONAOS_ARTIFACT_RECORD: /app/pronaos-build/pronaos-artifact.json
      LAR_SAME_ORIGIN: "true"
      GITHUB_CLIENT_ID:     ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    ports:
      - "4321:4321"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4321/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─── mcp-dev — MCP stdio, tsx watch ────────────────────────────────────────
  lararium-mcp-dev:
    profiles: [mcp-dev]
    image: node:24-slim
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    command: >
      sh -c "npm install -g pnpm &&
             pnpm install &&
             pnpm --filter @lararium/mcp exec tsx --watch src/stdio.ts"
    stdin_open: true
    tty: true

  # ─── mcp-qa — MCP stdio, built image ───────────────────────────────────────
  lararium-mcp-qa:
    profiles: [mcp-qa]
    build:
      context: .
      dockerfile: Dockerfile
      target: mcp-runtime
    volumes:
      - ./lares:/app/lares:rw
    environment:
      NODE_ENV: qa
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── mcp-prod — MCP stdio, lares/ read-only ────────────────────────────────
  lararium-mcp-prod:
    profiles: [mcp-prod]
    build:
      context: .
      dockerfile: Dockerfile
      target: mcp-runtime
    volumes:
      - ./lares:/app/lares:ro
    environment:
      NODE_ENV: production
    stdin_open: true
    tty: true
    restart: unless-stopped

  # ─── qa-smoke — stdio smoke tests against built image ──────────────────────
  lararium-qa-smoke:
    profiles: [qa-smoke]
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    volumes:
      - ./lares:/app/lares:ro
    environment:
      NODE_ENV: test
    command: >
      sh -c "NODE_OPTIONS=--experimental-vm-modules
             pnpm exec jest
             --config packages/lararium-mcp/jest.config.cjs"

volumes:
  lararium-data:
    driver: local

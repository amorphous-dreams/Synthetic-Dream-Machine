# docker-compose.crossing.yml — the containerized browser↔node CROSSING (civic-protocol transport +
# auth + sync gate, over a real network hop). The in-process browser-crossing.test proves the logic;
# this proves it holds across a container boundary — the pre-browser gate.
#
#   crossing-daemon  the NODE half: WS server behind a sovereign SEALED GATE (Noise IK flight, sealed
#                    presentation, signed verdict) + Automerge Repo + a seeded doc. Admits the crossing face.
#   crossing-client  the BROWSER half: a face presentation + LarWSClientAdapter crosses the armed gate
#                    and syncs the doc. Its EXIT CODE is the test verdict (0 = the DreamNet breathes).
#
# Handshake rides the shared volume: daemon publishes crossing.json (gate pin + doc url + port) → client crosses +
# syncs. Both halves derive the Nexus, its quorum and the face from one label, so no key crosses the volume.
#
# The whole matrix (admitted / anon / impostor / wrong-bind):  tools/crossing-witness.sh
# One scenario:  LAR_CROSS_ROLE=admitted docker compose -f docker-compose.crossing.yml up \
#                  --abort-on-container-exit --exit-code-from crossing-client
# Green:   crossing-client exits 0. The shared handshake rides a NAMED volume (crossing-run) that
#          `down -v` wipes — no host bind-mount, so container-written files leave no root-owned litter.
# Down:    docker compose -f docker-compose.crossing.yml down -v

name: dreamnet-crossing

# Node services require the product image digest in LARES_HARNESS_IMAGE.

services:
  crossing-daemon:
    image: "${LARES_HARNESS_IMAGE:?name the built image by digest — tools/harness-image.sh prints it}"
    volumes:
      - "crossing-daemon-state:/state"
      - "crossing-run:/workspace"
    networks: [crossing]
    restart: "no"
    environment:
      LAR_ROOT: "/state"
      LAR_CROSSING_PORT:   "8080"
      LAR_CROSSING_SHARED: "/workspace"
      LAR_CROSSING_GREET:  "the DreamNet breathes"
      LAR_CROSSING_ADMIT:  "${LAR_CROSSING_ADMIT:-from-file}"   # from-file | none — set per scenario
    entrypoint: ["node", "packages/lararium-node/dist/probes/crossing-daemon.js"]

  crossing-client:
    image: "${LARES_HARNESS_IMAGE:?name the built image by digest — tools/harness-image.sh prints it}"
    volumes:
      - "crossing-client-state:/state"
      - "crossing-run:/workspace"
    networks: [crossing]
    restart: "no"
    environment:
      LAR_ROOT: "/state"
      LAR_CROSSING_SHARED:      "/workspace"
      LAR_CROSSING_DAEMON_HOST: "crossing-daemon"
      LAR_CROSSING_GREET:       "the DreamNet breathes"
      LAR_CROSS_ROLE:           "${LAR_CROSS_ROLE:-admitted}"   # admitted | anon | impostor | wrong-bind
    entrypoint: ["node", "packages/lararium-node/dist/probes/crossing-client.js"]
    depends_on: [crossing-daemon]

networks:
  crossing:
    driver: bridge

volumes:
  crossing-daemon-state:
  crossing-client-state:
  crossing-run:      # the crossing.json coordinates handshake; wiped by `down -v` each scenario

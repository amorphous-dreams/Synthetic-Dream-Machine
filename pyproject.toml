[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lares"
version = "0.1.0"
description = "Modular MCP server and agentic framework."
authors = [
    { name="Your Name", email="your@email.com" }
]
readme = "README.md"
# The stack RUNS on 3.12 and writes 3.12 (PEP 701 f-strings in the scorer's report path), and the one
# venv the setup enforces carries 3.12. A floor of 3.8 declared a compatibility the code never held —
# and it read as a lint error rather than a broken promise, because the linter believed the floor.
requires-python = ">=3.12"
license = { file = "LICENSE" }

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lares*"]
exclude = [
    "mempalace*",
    "kowloon*",
    "kowloon-client*",
    "kowloon-frontend*",
    "tiddlywiki5*",
    "tldraw*"
]

[tool.pytest.ini_options]
# WHERE THE PYTHON SUITES ACTUALLY LIVE. The sensorium holders keep their tests beside the modules
# they exercise (flat-import idiom — `import holder_caps`, no package prefix), so the suite root sits
# at the scripts directory rather than under a `tests/` tree. Naming a path that holds no test file
# makes `pytest` collect ZERO and exit 0, which reads exactly like a green run.
# The grammar fold's host-py suites sit beside their own holder, the same flat-import idiom one
# package over. Unlisted, they ran only when someone named the path by hand, which made the
# collected total a floor rather than a count.
testpaths = [
    "packages/lararium-sensorium/scripts",
    "packages/tree-sitter-memetic-wikitext/host-py",
]
# COLLECTION MUST NOT DEPEND ON THE INVOKER'S SHELL. The holders consume the vendored mempalace as a
# library, so 28 modules raise `ModuleNotFoundError: No module named 'mempalace'` at import time and
# pytest reports them as collection ERRORS — 679 tests gathered instead of 944. An operator who had
# exported PYTHONPATH saw the full set; one who had not saw a smaller suite pass green, and nothing
# on the wire distinguished the two. Declaring the path here makes the count a property of the REPO.
#
# THE SAME LAW STOPS AT THE PROCESS BOUNDARY, and does not cross it. `pythonpath` is a pytest-ini
# setting: it prepends to THIS process's `sys.path` and never touches the `PYTHONPATH` env var, so a
# suite that spawns the real CLI as a child hands it an environment with no path at all. Do not try
# to fix that by writing `PYTHONPATH` from a `pytest_configure` hook — doing so costs three tests at
# collection (`test_capture_corpus.py` stops resolving `holder_caps`), reproducible on a clean tree.
# The cure belongs at each spawn; `test_loci_io.py::_child_env` carries the worked one.
pythonpath = [
    "mempalace",
    "packages/lararium-sensorium/scripts",
]
norecursedirs = [
    ".git",
    ".venv",
    "mempalace",
    "kowloon",
    "kowloon-client",
    "kowloon-frontend",
    "tiddlywiki5",
    "tldraw"
]

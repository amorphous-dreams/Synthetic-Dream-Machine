name: Recover verified Necrospire breeding evidence

on:
  push:
    branches:
      - experiment/loom-evolution-transfer-20261024
    paths:
      - .github/workflows/recover-necrospire-breeding-results.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: recover-necrospire-breeding-20261025
  cancel-in-progress: false

jobs:
  recover:
    name: Commit source-checked winner, archive, and short handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_HEAD: bf7ad0edd1af0eb77623e05a1872a075a4611668
      TARGET_BRANCH: feature/loom-lineage-campaign
      ORIGINAL_RUN: '40160038920'
    steps:
      - name: Checkout lineage branch to publish onto
        uses: actions/checkout@v4
        with:
          ref: feature/loom-lineage-campaign
          fetch-depth: 0
          persist-credentials: true
      - name: Confirm unmodified source and download the interrupted audited run
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p "$RUNNER_TEMP/recovered"
          gh run download "$ORIGINAL_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --name necrospire-six-generation-breeding-evidence \
            --dir "$RUNNER_TEMP/recovered"
          base="$RUNNER_TEMP/recovered/examples/necrospire/experiments/breeding_20261025"
          test -f "$base/RESULTS.json"
          test -f "$base/SHA256SUMS.txt"
          (cd "$base" && sha256sum -c SHA256SUMS.txt)
          python - <<'PY'
          import json,os,zipfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'recovered/examples/necrospire/experiments/breeding_20261025'
          data=json.loads((root/'RESULTS.json').read_text())
          assert data['status']=='completed'
          assert data['implementation_commit']==os.environ['EXPECTED_HEAD']
          assert data['pre_regional_commit']=='f403f9f5cd181f6cd7a2bbc2b9af32fd298bd4ac'
          assert data['source_alpha_sha256']=='78f8d1f0cf44a98b748054ae8b5c8f2229c1354696a8e1173963a7c98bc4fbe7'
          assert data['recipe_sha256']=='7f317bc1abcce96979ea7b37c51219e9a3134856a8e387a736bb3fa6ba024b2a'
          assert data['births']==432 and data['states']=={'deferred':216,'scored':108,'audited':108}
          assert data['best']['candidate_id']=='needle-006-004' and abs(data['best']['iou']-.7384098006245496)<1e-9
          assert data['finalists']==3 and data['masks_distinct']==89
          for filename in ('necrospire_breeding_sixgen_complete.zip','necrospire_breeding_regional_control.zip'):
              with zipfile.ZipFile(root/filename) as z:
                  assert z.testzip() is None
          print('RECOVERY VERIFIED: complete six-generation winner and independent regional control')
          PY
      - name: Restore original outputs and prepare handoff
        run: |
          set -euo pipefail
          base=tools/projection-loom/examples/necrospire/experiments/breeding_20261025
          mkdir -p "$base" tools/projection-loom/docs
          cp -a "$RUNNER_TEMP/recovered/examples/necrospire/experiments/breeding_20261025/." "$base/"
          cat > tools/projection-loom/docs/BRANCHED_SESSION_HANDOFF.md <<'EOF'
          # Loom / Necrospire — re-entry (2026-10-25)

          Boot: `feature/green-jello-dinosaur-5` `noosphere-boot.mem`. Work: PR #84 `feature/green-jello-dinosaur-5--projection-loom`; inspect live head before running.

          Waves XX–XXIV add fair auditions, six-family breeding, source-bound version-2 grammar, durable culling, and six-band phenotype niches. The **frozen pre-regional** six-generation pilot: 432 births, 216 exact auditions, 108 scored, 89 unique masks; winner **needle-006-004**, IoU **0.738410** (prior 0.704476), provisional. Native STEP/OBJ and full archive: `examples/necrospire/experiments/breeding_20261025/`.

          Separate regional-control run uses **new** six-band semantics. Next: fresh six-generation post-regional run, then compare independent audits, contour diversity and lineage survival; never relabel the frozen archive. No source promotion or cross-kernel fusion claim.
          EOF
          (cd "$base" && sha256sum -c SHA256SUMS.txt)
      - name: Commit winner, frozen evidence, and short branched-session handoff separately
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          base=tools/projection-loom/examples/necrospire/experiments/breeding_20261025
          git add "$base/README.md" "$base/RESULTS.json" "$base/full_pytest.log" \
            "$base/lineage_gallery_receipt.json" "$base/regional_control_gallery_receipt.json" \
            "$base/sixgen_native_audit.json" "$base/regional_native_audit.json" \
            "$base/sixgen_family_gallery.png" "$base/winner_needle-006-004"
          git commit -m 'experiment(necrospire): recover verified six-generation winning lineage and native receipts'
          git add -f "$base/necrospire_breeding_sixgen_complete.zip" "$base/necrospire_breeding_regional_control.zip"
          git add "$base/SHA256SUMS.txt"
          git commit -m 'experiment(necrospire): freeze complete six-generation and regional-control archives'
          git add tools/projection-loom/docs/BRANCHED_SESSION_HANDOFF.md
          git commit -m 'docs(loom): very short branch handoff for winning Necrospire campaign'
          git diff --exit-code
          git diff --cached --exit-code
          echo 'Untracked files are reported but not promoted:'
          git status --short
          test "$(git rev-parse HEAD~3)" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "PUBLISHED=$(git rev-parse HEAD)"

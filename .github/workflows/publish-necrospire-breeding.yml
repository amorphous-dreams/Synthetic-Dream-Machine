name: Publish audited Necrospire breeding winner and lineage receipts

on:
  push:
    branches: [experiment/loom-evolution-transfer-20261024]
    paths: [.github/workflows/publish-necrospire-breeding.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: necrospire-breeding-results-publish
  cancel-in-progress: false

jobs:
  reproduce-and-publish:
    name: Freeze audited six-generation winner and separate regional control
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TARGET_BRANCH: feature/loom-lineage-campaign
      SOURCE_HEAD: bf7ad0edd1af0eb77623e05a1872a075a4611668
      BASE_COMMIT: 035fb47f93e3170d38d2168de41ea955bac20f20
      ALPHA_SHA256: 78f8d1f0cf44a98b748054ae8b5c8f2229c1354696a8e1173963a7c98bc4fbe7
      RECIPE_SHA256: 7f317bc1abcce96979ea7b37c51219e9a3134856a8e387a736bb3fa6ba024b2a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/loom-lineage-campaign
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/projection-loom/requirements-ci.txt
      - name: Exact code head, dependency and source verification
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq openscad
          python -m pip install --upgrade pip
          python -m pip install -r tools/projection-loom/requirements-ci.txt
          python -m pip install --no-deps -e tools/projection-loom
          python -m pip check
          cd tools/projection-loom
          python scripts/check_architecture.py
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          base=Path('examples/necrospire')
          recipe=json.loads((base/'hybrid/recipe_breeding.json').read_text())
          checksum=hashlib.sha256((base/'source_alpha_8bit.png').read_bytes()).hexdigest()
          assert checksum==os.environ['ALPHA_SHA256']==recipe['source_hashes']['image']
          assert recipe['sha256']==os.environ['RECIPE_SHA256']
          print(json.dumps({'alpha_sha256':checksum,'recipe_sha256':recipe['sha256'],'test_head':os.environ['SOURCE_HEAD']}))
          PY
      - name: Green regression and single-helm architecture gates
        run: |
          set -euo pipefail
          cd tools/projection-loom
          python -m pytest -q tests | tee "$RUNNER_TEMP/necrospire-pytest.log"
      - name: Isolate the frozen pre-regional six-generation source
        run: |
          set -euo pipefail
          PRE="$(git log --format='%H' --grep='evergreen four breeding waves with provenance' -1)"
          test -n "$PRE"
          echo "PRE_REGIONAL_SHA=$PRE" >> "$GITHUB_ENV"
          git worktree add --detach "$RUNNER_TEMP/necrospire-pre-region" "$PRE"
          test -f "$RUNNER_TEMP/necrospire-pre-region/tools/projection-loom/examples/necrospire/hybrid/recipe_breeding.json"
          test -f "$RUNNER_TEMP/necrospire-pre-region/tools/projection-loom/examples/necrospire/source_alpha_8bit.png"
          echo "Frozen source SHA: $PRE"
      - name: Reproduce full six-family six-generation baseline
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/necrospire-pre-region/tools/projection-loom"
          python -m projection_loom ooda-run \
            --project examples/necrospire/project_breeding.json \
            --capability-recipe examples/necrospire/hybrid/recipe_breeding.json \
            --out "$RUNNER_TEMP/necrospire-six-generation" \
            --control full-speed --breeding --passes 6 \
            --offspring-per-family 12 --exact-budget 36 --detail-budget 18 \
            --seed 41 --score-size 128 192 --finalists 3 \
            > "$RUNNER_TEMP/necrospire-sixgen.log" 2>&1
          python scripts/check_compound_epoch.py --out "$RUNNER_TEMP/necrospire-six-generation" | tee "$RUNNER_TEMP/necrospire-sixgen-audit.json"
      - name: Run fresh, distinct one-generation regional phenotype control
        run: |
          set -euo pipefail
          cd tools/projection-loom
          python -m projection_loom ooda-run \
            --project examples/necrospire/project_breeding.json \
            --capability-recipe examples/necrospire/hybrid/recipe_breeding.json \
            --out "$RUNNER_TEMP/necrospire-regional-control" \
            --control full-speed --breeding --passes 1 \
            --offspring-per-family 3 --exact-budget 12 --detail-budget 12 \
            --seed 41 --score-size 128 192 --finalists 3 \
            > "$RUNNER_TEMP/necrospire-regional.log" 2>&1
          python scripts/check_compound_epoch.py --out "$RUNNER_TEMP/necrospire-regional-control" | tee "$RUNNER_TEMP/necrospire-regional-audit.json"
      - name: Inspect winners, archive frozen epochs and prepare commits
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,shutil,zipfile
          from pathlib import Path
          from collections import Counter,defaultdict
          repo=Path(os.environ['GITHUB_WORKSPACE'])
          tmp=Path(os.environ['RUNNER_TEMP'])
          six=tmp/'necrospire-six-generation'
          regional=tmp/'necrospire-regional-control'
          target=repo/'tools/projection-loom/examples/necrospire/experiments/breeding_20261025'
          winner=target/'winner_needle-006-004'
          winner.mkdir(parents=True,exist_ok=True)
          session=json.loads((six/'session.json').read_text())
          archive=json.loads((six/'lineage_archive.json').read_text())
          assert session['status']=='completed' and session['current_epoch']==6
          assert len(archive['generations'])==6
          states=Counter(); method=defaultdict(Counter); rows=[]; generations=[]
          for n in range(1,7):
              batch=json.loads((six/f'epoch_{n:03d}.json').read_text())
              assert len(batch['proposals'])==72
              counts=Counter(r['state'] for r in batch['results'].values())
              states.update(counts)
              for pid,row in batch['results'].items():
                  if row['state']!='scored':continue
                  family,variation=row['emitter'].split(':')[1:]
                  method[family][variation]+=1
                  assert row['audit']['valid_joints'] is True
                  rows.append({'generation':n,'candidate_id':pid,'family':family,
                               'emitter':variation,'iou':1-row['losses']['silhouette'],
                               'loss':row['combined_loss']})
              generations.append({'generation':n,'births':72,'states':dict(counts),
                                  'best_iou':max(x['iou'] for x in rows if x['generation']==n)})
          assert dict(states)=={'deferred':216,'scored':108,'audited':108},states
          assert len(method)==6
          assert all(set(m)=={'local','sobol','topology'} and all(v==6 for v in m.values()) for m in method.values())
          best=max(rows,key=lambda r:r['iou'])
          assert best['candidate_id']=='needle-006-004' and best['generation']==6
          assert abs(best['iou']-0.7384098006245496)<0.000001,best
          assert len(archive['champions'])==6
          distinct_masks=len({r['mask_sha256'] for r in archive['members'].values()})
          assert distinct_masks==89,distinct_masks
          assert len(archive['elites'])==2
          six_gallery=json.loads((six/'lineage_gallery/gallery.json').read_text())
          final_gallery=json.loads((six/'finalists/gallery.json').read_text())
          assert six_gallery['actual_count']==12 and final_gallery['actual_count']==3
          assert final_gallery['cad_mesh_union_verified'] is False
          first=final_gallery['finalists'][0]
          assert first['epoch']==6 and abs(first['loss']-best['loss'])<1e-9
          regional_session=json.loads((regional/'session.json').read_text())
          regional_archive=json.loads((regional/'lineage_archive.json').read_text())
          regional_gallery=json.loads((regional/'lineage_gallery/gallery.json').read_text())
          assert regional_session['status']=='completed' and regional_session['current_epoch']==1
          assert len(regional_archive['elites'])>=4
          for filename in ('cad_body.step','composite_render.obj','scored_mask.png',
                           'genome.json','relations.json','compound_manifest.json','recipe.json'):
              shutil.copy2(six/'finalists/candidate_01'/filename,winner/filename)
          for src,dest in [(six/'lineage_gallery/contact_sheet.png','sixgen_family_gallery.png'),
                           (six/'lineage_gallery/gallery.json','lineage_gallery_receipt.json'),
                           (regional/'lineage_gallery/gallery.json','regional_control_gallery_receipt.json'),
                           (tmp/'necrospire-sixgen-audit.json','sixgen_native_audit.json'),
                           (tmp/'necrospire-regional-audit.json','regional_native_audit.json'),
                           (tmp/'necrospire-pytest.log','full_pytest.log')]:
              shutil.copy2(src,target/dest)
          audit=json.loads((target/'sixgen_native_audit.json').read_text())
          report={'schema':'projection-loom/necrospire-breeding-v2-completed-run/v1',
                  'status':session['status'],'source_commit':os.environ['BASE_COMMIT'],
                  'pre_regional_commit':os.environ['PRE_REGIONAL_SHA'],
                  'implementation_commit':os.environ['SOURCE_HEAD'],
                  'source_alpha_sha256':os.environ['ALPHA_SHA256'],
                  'recipe_sha256':os.environ['RECIPE_SHA256'],
                  'evidence_state':'provisional','cad_mesh_union_verified':False,
                  'parameters':{'generations':6,'families':6,'offspring_per_family':12,
                                'exact_budget':36,'detail_budget':18,'seed':41,'size':[128,192]},
                  'births':432,'states':dict(states),'best':best,'generations':generations,
                  'champions':{family:{'id':row['id'],'iou':1-row['losses']['silhouette']}
                               for family,row in archive['champions'].items()},
                  'masks_distinct':distinct_masks,'coarse_niches':len(archive['elites']),
                  'regional_control_niches':len(regional_archive['elites']),
                  'lineage_gallery_count':six_gallery['actual_count'],
                  'finalists':final_gallery['actual_count'],'audit':audit}
          (target/'RESULTS.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n')
          (target/'README.md').write_text(
              '# Necrospire breeding — frozen audited lineage receipts\n\n'
              '**Six-generation pre-regional baseline:** 432 births, 216 exact CAD auditions, '
              '108 scored candidates, six family champions. Best: **needle-006-004** '
              '(generation 6, provisional fixed-view IoU **0.738410** vs ~0.7045). '
              'STEP and OBJ are independently audited, **not** cross-kernel fused or surveyed.\n\n'
              'Winner STEP/OBJ/mask, genome, recipe, relation and construction receipts are '
              'in `winner_needle-006-004/`. `necrospire_breeding_sixgen_complete.zip` '
              'contains the full session, epochs, gallery and logs. '
              '`necrospire_breeding_regional_control.zip` is a **separate one-generation** '
              'run under the newer six-band descriptor; do not relabel the frozen baseline. '
              'See `tools/projection-loom/docs/BREEDING_CAMPAIGN.md`.\n')
          for run,label in [(six,'necrospire_breeding_sixgen_complete'),
                            (regional,'necrospire_breeding_regional_control')]:
              zpath=target/(label+'.zip')
              with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
                  for f in sorted(run.rglob('*')):
                      if f.is_file():z.write(f,label+'/'+str(f.relative_to(run)))
                  if label.endswith('sixgen_complete'):
                      z.write(target/'RESULTS.json','experiment_reports/RESULTS.json')
                      z.write(tmp/'necrospire-sixgen.log','experiment_reports/necrospire-sixgen.log')
                      z.write(tmp/'necrospire-sixgen-audit.json','experiment_reports/native-audit.json')
                  else:
                      z.write(tmp/'necrospire-regional.log','experiment_reports/necrospire-regional.log')
              with zipfile.ZipFile(zpath) as z:assert z.testzip() is None
          allfiles=sorted(p for p in target.rglob('*') if p.is_file() and p.name!='SHA256SUMS.txt')
          (target/'SHA256SUMS.txt').write_text(''.join(
              hashlib.sha256(p.read_bytes()).hexdigest()+'  '+str(p.relative_to(target))+'\n'
              for p in allfiles))
          handoff=repo/'tools/projection-loom/docs/BRANCHED_SESSION_HANDOFF.md'
          handoff.write_text(
              '# Necrospire campaign — branched-session handoff\n\n'
              'Read the current `feature/loom-lineage-campaign` head and the '
              '`noosphere-boot.mem` on `feature/green-jello-dinosaur-5`. '
              'Do not merge or promote provisional models without Operator authority.\n\n'
              'Waves XX–XXIV: fair emitter auditions, persistent six-family lineage archive, '
              'source-fixed v2 grammar, one-helm breeding/culling, corrected six-band '
              'phenotype niches. Source code regression suite green.\n\n'
              'Frozen **pre-regional** six-generation result: 432 births, 216 native '
              'CAD auditions, 108 scored, winner `needle-006-004` '
              '(fixed-view provisional IoU **0.738410**, prior ~0.7045). '
              'Artifacts including STEP, OBJ, receipts and complete ZIP are '
              'in `examples/necrospire/experiments/breeding_20261025/`. '
              'Separate regional control is **one generation under newer niche semantics**.\n\n'
              '**Next:** re-check the published head and CI, run a fresh full six-generation '
              'post-regional campaign, and inspect actual lineage diversity, culling, '
              'and independent native audits. Never reopen old-code checkpoints.\n')
          print(json.dumps({'winner':best,'states':dict(states),'family_champions':len(archive['champions']),
                            'regional_niches':len(regional_archive['elites']),
                            'result_files':len(allfiles),'results_dir':str(target)},indent=2))
          PY
      - name: Commit winner, then full receipts and very short handoff
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          base=tools/projection-loom/examples/necrospire/experiments/breeding_20261025
          git add "$base/README.md" "$base/RESULTS.json" "$base/full_pytest.log" \
            "$base/lineage_gallery_receipt.json" "$base/regional_control_gallery_receipt.json" \
            "$base/sixgen_native_audit.json" "$base/regional_native_audit.json" \
            "$base/sixgen_family_gallery.png" "$base/winner_needle-006-004"
          git commit -m 'experiment(necrospire): publish independently reproduced six-generation winning lineage'
          git add -f "$base/necrospire_breeding_sixgen_complete.zip" "$base/necrospire_breeding_regional_control.zip"
          git add "$base/SHA256SUMS.txt"
          git commit -m 'experiment(necrospire): archive full six-generation and regional-control evidence'
          git add tools/projection-loom/docs/BRANCHED_SESSION_HANDOFF.md
          git commit -m 'docs(loom): short branched-session handoff for new breeding campaign'
          test -z "$(git status --porcelain)"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "Committed full Necrospire results at $(git rev-parse HEAD)"
      - name: Save independent experimental outputs even if publication fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: necrospire-six-generation-breeding-evidence
          path: |
            tools/projection-loom/examples/necrospire/experiments/breeding_20261025/**
            tools/projection-loom/docs/BRANCHED_SESSION_HANDOFF.md
          if-no-files-found: warn
          retention-days: 30

name: E2E shards

# EVERY e2e set (the table `E2E_SETS` in tools/e2e-shards.mjs: the main set under tests/ split four
# ways, the node package's own set riding shard 3 as a companion run) rides the vitest shard matrix below, each shard a SELF-CONTAINED runner: its own recursive checkout, its own
# frozen install, its own TW5 core render, its own build, then only its slice of the suite. A
# merge job reassembles every shard's report and FAILS CLOSED unless every shard of every set
# answered, none failed, none ran zero tests, and each set's union of files actually run is EXACTLY
# that set's own tracked file list (a set the lane never ran refuses by name; a test holds this
# matrix to the table) — a quiet red (a shard that silently ran nothing, or a file nobody ran)
# must read exactly as loud as a failing assertion. `tools/e2e-shards.mjs#evaluateMergeGate`
# carries that law; this job's "Merge gate" step is its only caller in anger.
#
# TWO DOORS, ONE MATRIX. `tools/e2e-shards.mjs` pushes a throwaway `ci/<lane>` branch, watches the ONE
# run that push triggers here, reads this workflow's verdict, and deletes the branch — never a second
# `workflow_dispatch` on top of that push (see the helper's docblock). `ci.yml` CALLS this workflow as
# its `E2E` job (`workflow_call`), so a branch push takes its e2e verdict from this same matrix and
# merge gate. `ci.yml`'s own push trigger excludes `ci/**`, so a lane push never raises full CI beside
# its shards: one push, one e2e verdict.
#
# ONE BUILD PER SHARD. A single build shared across runners would need its own artifact-transfer
# job this workflow does not carry; four independent builds cost more CPU-minutes but no coordination,
# and the repo is public, so Linux minutes bill to net $0 against the org's usage.

on:
  push:
    branches: ["ci/**"]
  workflow_dispatch: {}
  # `ci.yml`'s `E2E` job calls this workflow; it takes no input and hands back no output but its verdict.
  workflow_call: {}

# Called from `ci.yml`, this group reads under the CALLER's ref, beside the caller's own `ci-<ref>` group:
# two names, so the pair never waits on itself.
concurrency:
  group: e2e-shards-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  # ONE pnpm, exact: the same string ci.yml and the Dockerfile pin. A lock written by any other
  # pnpm rewrites its peer suffixes on its next write.
  PNPM_VERSION: "11.28.5"

jobs:
  # ─── shard (4-way) ──────────────────────────────────────────────────────────────────────────
  shard:
    name: Shard ${{ matrix.set }} ${{ matrix.shard }}/${{ matrix.count }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      # A red shard must never cancel its siblings — the merge gate needs to see ALL FOUR
      # verdicts to tell "one shard failed" apart from "one shard never got to answer".
      fail-fast: false
      # One row per (set, shard); `count` is the set's shard total. tools/e2e-shards.test.mjs holds
      # these rows to `E2E_SETS`.
      matrix:
        include:
          - { set: tests, dir: tests, config: vitest.config.ts, shard: 1, count: 4 }
          - { set: tests, dir: tests, config: vitest.config.ts, shard: 2, count: 4 }
          - { set: tests, dir: tests, config: vitest.config.ts, shard: 3, count: 4, companion: node }
          - { set: tests, dir: tests, config: vitest.config.ts, shard: 4, count: 4 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # TiddlyWiki5 IS the vendored-core build input and mempalace IS the python import root;
          # the e2e set stages real vessels from the built CLI, which needs both.
          submodules: recursive
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Render the TW5 core blob (genesis bakes from it)
        run: pnpm --filter @lararium/tw5 build:tw5-vendor
      - name: Build (vessels run from dist)
        run: pnpm build
      # THE MCP SEAT WALKS HERE TOO. `mcp-seat-binds-the-hearth` spawns the real `lares_mcp.py` against a staged
      # hearth, so the shard holds THE venv (`~/.venv`) the seat resolves, stood from the same list and cached
      # under the same key as ci.yml's test cells (one cache, restored by key).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Cache the holder venv
        id: venv-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.venv
          key: holder-venv-${{ runner.os }}-py312-${{ hashFiles('mempalace/pyproject.toml', 'packages/lararium-sensorium/requirements.txt') }}
      - name: Stand the holder venv (~/.venv)
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv ~/.venv
          ~/.venv/bin/python3 -m pip install --upgrade pip
          ~/.venv/bin/python3 -m pip install -e ./mempalace -r packages/lararium-sensorium/requirements.txt
      - name: Witness the holder answers
        run: ~/.venv/bin/python3 -c "import mempalace; from mcp.server.mcpserver import MCPServer; print('holder ok')"
      - name: Run this shard's slice of its e2e set
        working-directory: ${{ matrix.dir }}
        env:
          # Explicit siting for this runner, never the gitignored `lar-dev-root.json` dev-preset
          # marker a desk checkout might carry — a fresh clone (and every hosted runner) has
          # neither, and `larRoot()` throws a clean error rather than silently sitting the repo
          # checkout as the corpus. Each shard gets its own directory; the shards never share a VM.
          LAR_ROOT: ${{ runner.temp }}/lar-root-${{ matrix.set }}-${{ matrix.shard }}
        run: |
          mkdir -p "$LAR_ROOT"
          # THE DEAL IS BY MEASURED WEIGHT, never vitest's path hash: `tools/e2e-shards.mjs shard-files` reads
          # `tools/e2e-shard-weights.json`, and the merge gate still reads every tracked file run exactly once.
          mapfile -t files < <(node "$GITHUB_WORKSPACE/tools/e2e-shards.mjs" shard-files --set "${{ matrix.set }}" --shard "${{ matrix.shard }}" --repo-root "$GITHUB_WORKSPACE")
          test "${#files[@]}" -gt 0
          npx vitest run --config "${{ matrix.config }}" "${files[@]}" \
            --reporter=blob --reporter=json \
            --outputFile.json=".vitest/blob/report-shard-${{ matrix.set }}-${{ matrix.shard }}.json"
        timeout-minutes: 45
      # THE COMPANION SET RIDES THIS RUNNER. A full CI run raises at most ten jobs (tools/ci-graph.test.mjs), so the node
      # package's 47-second e2e set takes no runner of its own: it runs here, after the shard's slice, and uploads under its
      # own artifact name (`e2e-shard-node-1`), so the merge gate reads it exactly as it read the shard it replaces.
      - name: Run the companion set beside this shard
        if: ${{ !cancelled() && matrix.companion != '' }}
        working-directory: packages/lararium-node
        env:
          LAR_ROOT: ${{ runner.temp }}/lar-root-${{ matrix.companion }}-1
        run: |
          mkdir -p "$LAR_ROOT"
          mapfile -t files < <(node "$GITHUB_WORKSPACE/tools/e2e-shards.mjs" shard-files --set "${{ matrix.companion }}" --shard 1 --repo-root "$GITHUB_WORKSPACE")
          test "${#files[@]}" -gt 0
          npx vitest run --config vitest.e2e.config.ts "${files[@]}" \
            --reporter=blob --reporter=json \
            --outputFile.json=".vitest/blob/report-shard-${{ matrix.companion }}-1.json"
        timeout-minutes: 15
      - name: Upload this shard's blob + JSON report (always, even on a red shard)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-shard-${{ matrix.set }}-${{ matrix.shard }}
          path: ${{ matrix.dir }}/.vitest/blob/
          retention-days: 3
          # A shard that crashed before vitest ever wrote a blob must still show up as an
          # artifact-less entry the merge gate can name as missing, never as a step that is
          # itself silently green because it had nothing to upload.
          if-no-files-found: warn
      - name: Upload the companion set's blob + JSON report (always, even on a red run)
        if: ${{ always() && matrix.companion != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-shard-${{ matrix.companion }}-1
          path: packages/lararium-node/.vitest/blob/
          retention-days: 3
          if-no-files-found: warn

  # ─── merge (fails closed) ──────────────────────────────────────────────────────────────────────
  merge:
    name: Merge shard reports
    needs: shard
    # Runs whatever the shards answered — a job gated on `needs.shard.result == 'success'` would
    # let one red shard SKIP the merge gate instead of failing it, and a skipped required check
    # reads as "nothing to report" rather than as the red this gate exists to surface.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No build needed here — this job reads only `git ls-files` over each set's e2e glob (tracked at the
          # top level, no submodule content) and the shard artifacts downloaded below — but the
          # pnpm workspace's own lockfile names TiddlyWiki5 (the submodule) as an importer, so
          # `pnpm install --frozen-lockfile` refuses a non-recursive checkout outright (its
          # package.json is simply absent): the live proof run caught exactly this.
          submodules: recursive
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download every shard's artifact (one subdirectory per shard, by artifact name)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
        continue-on-error: true
        # A shard that uploaded nothing (it crashed before the upload step, or the step above
        # warned with no files) leaves this download with fewer than 4 subdirectories rather than
        # failing the step — the merge gate below is what must name that as "missing artifact:
        # shard N", not a bare download failure with no named shard.
      - name: Collect every shard's blob into one directory (vitest's documented merge input)
        run: |
          mkdir -p merged-blobs
          find artifacts -name 'blob-*.json' -exec cp {} merged-blobs/ \; 2>/dev/null || true
      - name: vitest --merge-reports (the documented sharded-report merge flow)
        working-directory: tests
        # `--merge-reports` reads the recorded blobs and reports; it runs no test file
        # itself. It stays its own step, separate from the merge gate below, because vitest's own
        # merge reads SILENT ZERO when blobs are missing (exit 0, "no tests") — the gate step
        # names that loudly instead of trusting this command's exit code.
        run: |
          npx vitest run --config vitest.config.ts --merge-reports=../merged-blobs \
            --reporter=default --reporter=json --outputFile.json=../merged-report.json || true
      - name: Merge gate — fails closed on any missing, empty, red or mismatched shard
        run: node tools/e2e-shards.mjs merge-verify --artifacts-dir artifacts

name: Transfer audited Loom lineage commits

on:
  push:
    branches: [experiment/loom-evolution-transfer-20261024]
    paths: [.github/workflows/transfer-loom-lineage.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: loom-lineage-transfer-v1
  cancel-in-progress: false

jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_COMMIT: 035fb47f93e3170d38d2168de41ea955bac20f20
      TARGET_BRANCH: feature/loom-lineage-campaign
    steps:
      - name: Checkout transport branch with credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Reassemble SHA-pinned 12-commit patch
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/lineage.patch.xz"
          for sha in fe291d113facde02dcab259c0047b94aea389d60 b9f0099bb3443edf607987f83dd36363b103a38a 59e77381568a171990dd34343de893410394a043 ec663e073b3c2730f589843a74d6a9f49a6dfd49 4a4d7de09112494f57e25ea7fc612ba365a7a25a 014c5bb76c51932ad99fa0e9e311c904d9ae2f62 7a974a10559b4d52b39324f2f3dff2ebe80da21b a19ca956d2d6ac14d54e8c4b9d01b07f816b9e90; do
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" --jq .content | base64 -d >> "$RUNNER_TEMP/lineage.patch.xz"
          done
          echo 'b08ee14027df32a21935593059fdfadee0b534eeacee512cdad3c8bf2302b6a1  '"$RUNNER_TEMP/lineage.patch.xz" | sha256sum -c -
          xz -dc "$RUNNER_TEMP/lineage.patch.xz" > "$RUNNER_TEMP/lineage.patch"
          test "$(grep -c '^Subject: ' "$RUNNER_TEMP/lineage.patch")" -eq 12
          grep '^Subject:' "$RUNNER_TEMP/lineage.patch"
      - name: Apply all RED, GREEN, evergreen commits to exact PR-84 source
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$BASE_COMMIT"
          git switch -C lineage-published "refs/remotes/origin/${TARGET_BRANCH}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git am --3way "$RUNNER_TEMP/lineage.patch"
          actual="$(git rev-parse HEAD^{tree})"
          test "$actual" = df4ea4903231fce1c995f178e171f82308e0cfbd
          test -z "$(git status --porcelain)"
          python -m compileall -q tools/projection-loom/projection_loom tools/projection-loom/tests
          (cd tools/projection-loom && python scripts/check_architecture.py)
          git log -12 --oneline
      - name: Publish code branch by fast-forward only
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "Published ${TARGET_BRANCH} at $(git rev-parse HEAD)"

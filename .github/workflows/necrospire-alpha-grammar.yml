name: Necrospire alpha grammar and interaction witness
on:
  push:
    branches:
      - feature/green-jello-dinosaur-5--projection-loom
    paths:
      - '.github/workflows/necrospire-alpha-grammar.yml'
      - 'tools/projection-loom/projection_loom/**'
      - 'tools/projection-loom/examples/necrospire/**'
      - 'tools/projection-loom/tests/test_wave_xxv_search.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: necrospire-grammar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  v3-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    defaults:
      run:
        working-directory: tools/projection-loom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/projection-loom/requirements-ci.txt
      - name: Install exact CAD and renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openscad
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: RED contracts now green
        run: |
          python -m pytest -q tests/test_wave_xxv_search.py tests/test_open_topology.py tests/test_search_strategy_alpha.py
      - name: Fresh v3 generation with native CAD and independently regrown gallery
        run: |
          python -m projection_loom ooda-run \
            --project examples/necrospire/project_alpha.json \
            --capability-recipe examples/necrospire/hybrid/recipe_alpha.json \
            --out out/necrospire-v3-feature-grammar-witness \
            --control full-speed --breeding --passes 1 \
            --offspring-per-family 3 --exact-budget 12 --detail-budget 6 \
            --seed 41 --score-size 128 192 --finalists 3 \
            | tee out-alpha-grammar-run.log
      - name: Native OODA closure and v3 reachability receipt
        run: |
          python scripts/check_compound_epoch.py --out out/necrospire-v3-feature-grammar-witness \
            | tee out-alpha-grammar-native-audit.json
          python -m projection_loom search-census \
            --archive out/necrospire-v3-feature-grammar-witness/lineage_archive.json \
            --capability-recipe examples/necrospire/hybrid/recipe_alpha.json \
            --out out-alpha-grammar-census.json
          python - <<'PY'
          import json
          from pathlib import Path
          census=json.loads(Path('out-alpha-grammar-census.json').read_text())
          assert census['declared_loci']==29
          assert census['unreachable_loci']==[]
          assert census['scored_members']>0
          assert json.loads(Path('out/necrospire-v3-feature-grammar-witness/session.json').read_text())['status']=='completed'
          PY
      - name: Preserve independent source-bound receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: necrospire-v3-feature-grammar-witness
          path: |
            tools/projection-loom/out/necrospire-v3-feature-grammar-witness/
            tools/projection-loom/out-alpha-grammar-run.log
            tools/projection-loom/out-alpha-grammar-native-audit.json
            tools/projection-loom/out-alpha-grammar-census.json
          if-no-files-found: warn
          retention-days: 30

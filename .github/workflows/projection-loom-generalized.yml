name: Projection Loom input-generalization integration
on:
  push:
    branches: [feature/green-jello-dinosaur-5--projection-loom]
    paths:
      - '.github/workflows/projection-loom-generalized.yml'
      - 'tools/projection-loom/projection_loom/intent_seed.py'
      - 'tools/projection-loom/projection_loom/seed_adapters.py'
      - 'tools/projection-loom/projection_loom/developmental.py'
      - 'tools/projection-loom/projection_loom/intent_evolution.py'
      - 'tools/projection-loom/projection_loom/generalized_campaign.py'
      - 'tools/projection-loom/projection_loom/relational_ground.py'
      - 'tools/projection-loom/projection_loom/scene_usd.py'
      - 'tools/projection-loom/projection_loom/scene_variants.py'
      - 'tools/projection-loom/projection_loom/incremental_graph.py'
      - 'tools/projection-loom/projection_loom/editor_proposals.py'
      - 'tools/projection-loom/projection_loom/location_workspace.py'
      - 'tools/projection-loom/projection_loom/native_support.py'
      - 'tools/projection-loom/projection_loom/source_registration.py'
      - 'tools/projection-loom/projection_loom/location_stack.py'
      - 'tools/projection-loom/projection_loom/spatial_intent.py'
      - 'tools/projection-loom/projection_loom/place_genome.py'
      - 'tools/projection-loom/projection_loom/place_intent_preview.py'
      - 'tools/projection-loom/projection_loom/compound_intent_study.py'
      - 'tools/projection-loom/projection_loom/place_orthogonal_route.py'
      - 'tools/projection-loom/projection_loom/place_orthogonal_study.py'
      - 'tools/projection-loom/projection_loom/place_affordances.py'
      - 'tools/projection-loom/projection_loom/place_shelter.py'
      - 'tools/projection-loom/projection_loom/place_ascent.py'
      - 'tools/projection-loom/projection_loom/place_matched_trial.py'
      - 'tools/projection-loom/projection_loom/place_causal_support.py'
      - 'tools/projection-loom/projection_loom/place_campaign.py'
      - 'tools/projection-loom/projection_loom/place_amendment.py'
      - 'tools/projection-loom/projection_loom/place_bearing_causal.py'
      - 'tools/projection-loom/projection_loom/constructive_phases.py'
      - 'tools/projection-loom/projection_loom/fire_spatial.py'
      - 'tools/projection-loom/projection_loom/fire_contract.py'
      - 'tools/projection-loom/schemas/fire_proposal.schema.json'
      - 'tools/projection-loom/projection_loom/place_intent_contrast.py'
      - 'tools/projection-loom/projection_loom/place_comparison.py'
      - 'tools/projection-loom/projection_loom/place_gallery.py'
      - 'tools/projection-loom/scripts/place_intent_crucible.py'
      - 'tools/projection-loom/projection_loom/hephaestus_holistic.py'
      - 'tools/projection-loom/projection_loom/matched_registered_trial.py'
      - 'tools/projection-loom/projection_loom/fractal_ooda_ha.py'
      - 'tools/projection-loom/projection_loom/evidence_receipts.py'
      - 'tools/projection-loom/projection_loom/intent_evolution.py'
      - 'tools/projection-loom/projection_loom/regulative_growth.py'
      - 'tools/projection-loom/projection_loom/hephaestus_crucible.py'
      - 'tools/projection-loom/blender/**'
      - 'tools/projection-loom/scripts/real_blender_witness.py'
      - 'tools/projection-loom/projection_loom/contracts/**'
      - 'tools/projection-loom/projection_loom/cli.py'
      - 'tools/projection-loom/tests/test_hephaestus_*.py'
      - 'tools/projection-loom/tests/test_capability_producer.py'
      - 'tools/projection-loom/tests/test_hephaestus_multiview.py'
      - 'tools/projection-loom/tests/test_hephaestus_registered_multiview.py'
      - 'tools/projection-loom/tests/test_hephaestus_funnels.py'
      - 'tools/projection-loom/scripts/hephaestus_census.py'
      - 'tools/projection-loom/pyproject.toml'
      - 'tools/projection-loom/experiments/zero/**'
      - 'tools/projection-loom/tests/test_generalized_*.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: tools/projection-loom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/projection-loom/requirements-ci.txt
      - run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - run: python -m pytest -q tests/test_generalized_*.py tests/test_hephaestus_relational.py tests/test_hephaestus_incremental.py tests/test_hephaestus_regulative.py tests/test_capability_producer.py tests/test_hephaestus_census.py tests/test_hephaestus_admission.py tests/test_hephaestus_multiview.py tests/test_hephaestus_funnels.py tests/test_hephaestus_registration.py tests/test_hephaestus_registered_multiview.py tests/test_hephaestus_matched_trial.py tests/test_hephaestus_steering.py tests/test_hephaestus_spatial_intent.py tests/test_hephaestus_place_genome.py tests/test_hephaestus_fire_spatial.py tests/test_hephaestus_constructive_phases.py
      - run: python scripts/check_architecture.py
      - name: Source import/capability responsibility census
        run: python scripts/hephaestus_census.py --out out/hephaestus-census.json
      - name: Preserve module consumer graph
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hephaestus-module-census
          path: tools/projection-loom/out/hephaestus-census.json
          retention-days: 60
      - name: Seven independent and composed seed cohorts (one OODA-HA journal each)
        run: |
          set -o pipefail
          python -m experiments.zero.run \
            --inputs experiments/zero/inputs \
            --out out/generalized-experiment-zero \
            --epochs 3 --offspring 4 --exact-budget 4 --finalists 2 \
            | tee generalized-matrix.log
      - name: Preserve all exact cohorts, source/native receipts, refusals and previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generalized-experiment-zero
          path: |
            tools/projection-loom/out/generalized-experiment-zero/
            tools/projection-loom/generalized-matrix.log
          retention-days: 60

  usd-interchange:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: tools/projection-loom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/projection-loom/requirements-ci.txt
      - run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Headless real OpenUSD and native STEP reimport
        run: python -m pytest -q tests/test_hephaestus_usd.py tests/test_hephaestus_editor.py tests/test_hephaestus_crucible.py tests/test_hephaestus_variants.py tests/test_hephaestus_location_workspace.py tests/test_hephaestus_native_support.py tests/test_hephaestus_support_workspace.py tests/test_hephaestus_location_admission.py tests/test_hephaestus_transfer.py tests/test_hephaestus_transfer_adversarial.py tests/test_hephaestus_location_review.py tests/test_hephaestus_place_affordances.py tests/test_hephaestus_place_campaign.py tests/test_hephaestus_intent_contrast.py tests/test_hephaestus_place_comparison.py tests/test_hephaestus_place_gallery.py tests/test_hephaestus_place_shelter.py tests/test_hephaestus_place_ascent.py tests/test_hephaestus_place_matched_trial.py tests/test_hephaestus_place_causal_support.py tests/test_hephaestus_spatial_mutation.py tests/test_hephaestus_compound_spatial.py tests/test_hephaestus_place_intent_preview.py tests/test_hephaestus_place_steering.py tests/test_hephaestus_compound_intent_study.py tests/test_hephaestus_place_orthogonal_route.py tests/test_hephaestus_place_orthogonal_study.py tests/test_hephaestus_corner_route.py tests/test_hephaestus_place_frontiers.py tests/test_hephaestus_place_amendment.py tests/test_hephaestus_place_bearing.py tests/test_hephaestus_place_bearing_causal.py tests/test_hephaestus_place_bearing_chain.py
      - name: N9 source-fixed repeated shelter/ascent developmental trial
        run: python -m projection_loom.place_matched_trial --out out/n9-matched-site --epochs 2
      - name: Retain native N9 paired developmental workspaces and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n9-matched-native-spatial-development
          path: tools/projection-loom/out/n9-matched-site/
          retention-days: 60
      - name: N8 matched native intent-change experiment
        run: python -m projection_loom.place_intent_contrast --out out/n8-intent-contrast
      - name: Retain matched N8 native intent experiment receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n8-matched-intent-contrast
          path: tools/projection-loom/out/n8-intent-contrast/
          retention-days: 60
      - name: N8 native living-place intent and operator aftermath crucible
        run: python scripts/place_intent_crucible.py --out out/n8-two-heights
      - name: Retain N8 native place, descendants and abstaining operator receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n8-native-intent-place
          path: |
            tools/projection-loom/out/n8-two-heights/
            tools/projection-loom/out/n8-operator-review.json
            tools/projection-loom/out/n8-fixture-acceptance.json
            tools/projection-loom/out/n8-successor/
            tools/projection-loom/out/n8-two-heights-report.json
          retention-days: 60
      - name: Independent source/pose, bearing, causal edit and native USD holistic crucible
        run: |
          mkdir -p out
          python -m pytest -q tests/test_hephaestus_holistic.py --basetemp=out/hephaestus-holistic
      - name: Retain registered-source and three-stage native location crucible
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hephaestus-holistic-location
          path: tools/projection-loom/out/hephaestus-holistic/
          retention-days: 60
      - name: Independent subject native + OpenUSD + causal adversarial crucible
        run: python -m projection_loom.hephaestus_crucible --out out/hephaestus-crucible
      - name: Retain falsifiable crucible evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hephaestus-crucible
          path: tools/projection-loom/out/hephaestus-crucible/
          retention-days: 60

  blender-real-editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tools/projection-loom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/projection-loom/requirements-ci.txt
      - run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Install official USD-enabled Blender 4.5 LTS (digest-checked)
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o blender-linux.tar.xz \
            https://download.blender.org/release/Blender4.5/blender-4.5.15-linux-x64.tar.xz
          curl -fL --retry 3 -o blender-checksums.sha256 \
            https://download.blender.org/release/Blender4.5/blender-4.5.15.sha256
          grep 'blender-4.5.15-linux-x64.tar.xz' blender-checksums.sha256 \
            | sed 's/blender-4.5.15-linux-x64.tar.xz/blender-linux.tar.xz/' > blender-linux.sha256
          test -s blender-linux.sha256
          sha256sum -c blender-linux.sha256
          tar -xJf blender-linux.tar.xz
          echo "$PWD/blender-4.5.15-linux-x64" >> "$GITHUB_PATH"
      - name: Check official Blender contains USD import operator
        run: |
          blender --version
          blender -b -noaudio --python-expr "import bpy; assert hasattr(bpy.ops.wm, 'usd_import'), 'Official Blender build lacks USD import'"

      - name: Import, capture authored transform, re-audit CAD/STEP, and reload preserving operator work
        run: python scripts/real_blender_witness.py --out out/hephaestus-blender
      - name: Retain actual Blender scene, edit proposal, regeneration and refusal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hephaestus-blender-real-editor
          path: tools/projection-loom/out/hephaestus-blender/
          retention-days: 60

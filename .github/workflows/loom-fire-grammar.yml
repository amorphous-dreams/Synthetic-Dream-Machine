name: Loom current AI Fire · typed semantic/native grammar

on:
  push:
    branches: [feature/green-jello-dinosaur-5--projection-loom]
    paths:
      - '.github/workflows/loom-fire-grammar.yml'
      - 'bags/lares/ha.ka.ba/lares/api/art-sigils/**'
      - 'tools/projection-loom/projection_loom/fire_*.py'
      - 'tools/projection-loom/schemas/fire_proposal.schema.json'
      - 'tools/projection-loom/tests/test_fire*.py'
      - 'tools/projection-loom/projection_loom/cli.py'
      - 'tools/projection-loom/pyproject.toml'
      - 'tools/projection-loom/requirements-ci.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loom-fire-grammar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fire-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: tools/projection-loom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/projection-loom/requirements-ci.txt
      - name: Install existing native CAD kernels and strict schema validator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openscad
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Verify machine contracts, native graph transformations and provenance
        run: |
          python -m compileall -q projection_loom
          python -m pytest -q tests/test_fire_contract.py tests/test_fire_native.py tests/test_seed_entity.py tests/test_experiment_zero.py
      - name: Read actual named source context from the existing OODA-HA machinery
        run: |
          python -m projection_loom fire-context \
            --project examples/necrospire/project_alpha.json \
            --capability-recipe examples/necrospire/hybrid/recipe_alpha.json \
            --out fire-source-context.json
          python - <<'PY'
          from pathlib import Path
          import json
          source=json.loads(Path('fire-source-context.json').read_text())
          parts={row['handle']:row['selector'] for row in source['bindings']}
          candidates=[name for name in ('lower terrace','upper keep','crystal root')
                      if name in parts and parts[name]['kind']=='material']
          if len(candidates)<2:
              candidates=[k for k,v in parts.items() if v['kind']=='material' and v['slot']]
          assert len(candidates)>=2
          a,b=candidates[:2]
          p={'schema':'projection-loom/fire-proposal',
             'inscription':'<<~ art worktype="architecture" subject="crystal and fortress" read="a traversable bridge links two masses" >>',
             'folio':[{'kind':'study','text':'Explore a connecting structure against the unchanged source'}],
             'source':source['source'],
             'bindings':[{'alias':'a','selector':parts[a]},
                         {'alias':'b','selector':parts[b]}],
             'alternatives':[
                 {'id':'bridge','subject':'a','object':'b','relation':'bridges',
                  'implementation':'bridge-between','parameters':{'width':.5,'depth':.5}},
                 {'id':'held-question','subject':'a','object':'b','relation':'studies',
                  'implementation':'study-only','parameters':{}}],
             'intent':{'state':'proposed','read':'Two valid alternatives, no selection',
                       'attribution':'ai-interpretation'}}
          Path('fire-source-proposal.json').write_text(json.dumps(p,indent=2))
          print('Semantic entities:',a,b,'witness',source['source']['witness_id'])
          PY
          python -m projection_loom fire-audition \
            --project examples/necrospire/project_alpha.json \
            --capability-recipe examples/necrospire/hybrid/recipe_alpha.json \
            --proposal fire-source-proposal.json --out fire-source-audition.json
          python - <<'PY'
          import json
          from pathlib import Path
          record=json.loads(Path('fire-source-audition.json').read_text())
          assert len(record['results'])==2
          assert record['results'][1]['state']=='study-only'
          assert record['authority'].startswith('native-audited proposals')
          assert record['source_seed_sha256']
          print('Native Fire decisions:',[(r['id'],r['state']) for r in record['results']])
          PY
      - name: Upload attributable source and native experiment receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loom-fire-grammar-native
          path: |
            tools/projection-loom/fire-source-context.json
            tools/projection-loom/fire-source-proposal.json
            tools/projection-loom/fire-source-audition.json
          if-no-files-found: warn
          retention-days: 60

name: Loom current AI Fire · typed semantic/native grammar

on:
  push:
    branches: [feature/green-jello-dinosaur-5--projection-loom]
    paths:
      - '.github/workflows/loom-fire-grammar.yml'
      - 'bags/lares/ha.ka.ba/lares/api/art-sigils/**'
      - 'tools/projection-loom/projection_loom/fire_*.py'
      - 'tools/projection-loom/schemas/fire_proposal.schema.json'
      - 'tools/projection-loom/tests/test_fire*.py'
      - 'tools/projection-loom/projection_loom/cli.py'
      - 'tools/projection-loom/pyproject.toml'
      - 'tools/projection-loom/requirements-ci.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loom-fire-grammar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fire-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: tools/projection-loom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/projection-loom/requirements-ci.txt
      - name: Install existing native CAD kernels and strict schema validator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openscad
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Verify machine contracts, native graph transformations and provenance
        run: |
          python -m compileall -q projection_loom
          python -m pytest -q tests/test_fire_contract.py tests/test_fire_native.py tests/test_fire_expression.py tests/test_seed_entity.py tests/test_experiment_zero.py
      - name: Read actual named source context from the existing OODA-HA machinery
        run: |
          python -m projection_loom fire-context \
            --project examples/necrospire/project_alpha.json \
            --capability-recipe examples/necrospire/hybrid/recipe_alpha.json \
            --out fire-source-context.json
          python - <<'PY'
          from pathlib import Path
          import json
          source=json.loads(Path('fire-source-context.json').read_text())
          parts={row['handle']:row['selector'] for row in source['bindings']}
          candidates=[name for name in ('lower terrace','upper keep','crystal root')
                      if name in parts and parts[name]['kind']=='material']
          if len(candidates)<2:
              candidates=[k for k,v in parts.items() if v['kind']=='material' and v['slot']]
          assert len(candidates)>=2
          a,b=candidates[:2]
          p={'schema':'projection-loom/fire-proposal',
             'inscription':'<<~ art worktype="architecture" subject="crystal and fortress" read="a traversable bridge links two masses" >>',
             'folio':[{'kind':'study','text':'Explore a connecting structure against the unchanged source'}],
             'source':source['source'],
             'bindings':[{'alias':'a','selector':parts[a]},
                         {'alias':'b','selector':parts[b]}],
             'alternatives':[
                 {'id':'bridge','subject':'a','object':'b','relation':'bridges',
                  'implementation':'bridge-between','parameters':{'width':.5,'depth':.5}},
                 {'id':'held-question','subject':'a','object':'b','relation':'studies',
                  'implementation':'study-only','parameters':{}}],
             'intent':{'state':'proposed','read':'Two valid alternatives, no selection',
                       'attribution':'ai-interpretation'}}
          Path('fire-source-proposal.json').write_text(json.dumps(p,indent=2))
          print('Semantic entities:',a,b,'witness',source['source']['witness_id'])
          PY
          python -m projection_loom fire-audition \
            --project examples/necrospire/project_alpha.json \
            --capability-recipe examples/necrospire/hybrid/recipe_alpha.json \
            --proposal fire-source-proposal.json --out fire-source-audition.json
          python - <<'PY'
          import json
          from pathlib import Path
          record=json.loads(Path('fire-source-audition.json').read_text())
          assert len(record['results'])==2
          assert record['results'][1]['state']=='study-only'
          assert record['authority'].startswith('native-audited proposals')
          assert record['source_seed_sha256']
          print('Native Fire decisions:',[(r['id'],r['state']) for r in record['results']])
          PY
      - name: Prove real-source bearing variations and six-view differential handback
        run: |
          python examples/necrospire/fire_study.py \
            --context fire-source-context.json --out fire-bearing-proposal.json
          python -m projection_loom fire-audition \
            --project examples/necrospire/project_alpha.json \
            --capability-recipe examples/necrospire/hybrid/recipe_alpha.json \
            --proposal fire-bearing-proposal.json --out fire-bearing-audition.json
          python -m projection_loom fire-review \
            --project examples/necrospire/project_alpha.json \
            --capability-recipe examples/necrospire/hybrid/recipe_alpha.json \
            --receipt fire-bearing-audition.json --out fire-bearing-review
          python - <<'PY'
          import json
          from pathlib import Path
          audit=json.loads(Path('fire-bearing-audition.json').read_text())
          rows=audit['results']
          assert [r['state'] for r in rows]==['native-admitted','native-admitted','study-only'], rows
          summary=json.loads(Path('fire-bearing-review/summary.json').read_text())
          assert len(summary['alternatives'])==2
          assert all(len(row['views'])==6 for row in summary['alternatives'])
          assert all(row['added_volume']>0 for row in summary['alternatives'])
          assert all(Path('fire-bearing-review',summary[key]['path']).is_file()
                     for key in ('image','differences'))
          print('Source-bound native studies:',[(r['id'],r['state']) for r in rows])
          print('Per-view observable changes:',[r['expressed_in_views'] for r in summary['alternatives']])
          PY
      - name: Native single-seed free-play bearing cohort (two bounded probes)
        run: |
          for epoch in 1 2; do
            python examples/necrospire/fire_study.py --context fire-source-context.json --epoch "$epoch" --out "fire-probe-$epoch-proposal.json"
            python -m projection_loom fire-audition --project examples/necrospire/project_alpha.json --capability-recipe examples/necrospire/hybrid/recipe_alpha.json --proposal "fire-probe-$epoch-proposal.json" --out "fire-probe-$epoch-audition.json"
            python -m projection_loom fire-review --project examples/necrospire/project_alpha.json --capability-recipe examples/necrospire/hybrid/recipe_alpha.json --receipt "fire-probe-$epoch-audition.json" --out "fire-probe-$epoch-review"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          receipts=[]
          for epoch in (1,2):
              native=json.loads(Path(f'fire-probe-{epoch}-audition.json').read_text())
              review=json.loads(Path(f'fire-probe-{epoch}-review/summary.json').read_text())
              assert [r['state'] for r in native['results']]==['native-admitted','native-admitted','study-only']
              assert len(review['alternatives'])==2
              assert all(len(r['views'])==6 for r in review['alternatives'])
              receipts.append({'epoch':epoch,'plan':native['plan_sha256'],'added_volume':[r.get('added_volume') for r in native['results']],'expressed_views':[r['expressed_in_views'] for r in review['alternatives']]})
          assert receipts[0]['plan'] != receipts[1]['plan']
          Path('fire-probe-cohort.json').write_text(json.dumps(receipts,indent=2))
          print('Native Fire cohort:',receipts)
          PY
      - name: Upload attributable source and native experiment receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loom-fire-grammar-native
          path: |
            tools/projection-loom/fire-source-context.json
            tools/projection-loom/fire-source-proposal.json
            tools/projection-loom/fire-source-audition.json
            tools/projection-loom/fire-bearing-proposal.json
            tools/projection-loom/fire-bearing-audition.json
            tools/projection-loom/fire-bearing-review/**
            tools/projection-loom/fire-probe-*-proposal.json
            tools/projection-loom/fire-probe-*-audition.json
            tools/projection-loom/fire-probe-*-review/**
            tools/projection-loom/fire-probe-cohort.json
          if-no-files-found: warn
          retention-days: 60

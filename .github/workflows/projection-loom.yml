name: Projection Loom CAD and evidence CI

on:
  pull_request:
    branches:
      - feature/green-jello-dinosaur-5
    paths:
      - 'tools/projection-loom/**'
      - '.github/workflows/projection-loom.yml'
      - 'bags/lares/ha.ka.ba/lares/api/projection-loom*.mem'
  push:
    branches:
      - 'feature/green-jello-dinosaur-5--projection-loom'
      - 'feature/projection-loom-poc0-pair-a-ur-brutalist'
    paths:
      - 'tools/projection-loom/**'
      - '.github/workflows/projection-loom.yml'
  workflow_dispatch:
    inputs:
      public_reference:
        type: boolean
        description: 'Fetch the public CC0 Brutalist pack and upload an unreviewed SHA-256 lock'
        default: false

permissions:
  contents: read

concurrency:
  group: projection-loom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cad-and-hybrid:
    name: CAD, hybrid mesh, OODA helm and reference contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/projection-loom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/projection-loom/requirements-ci.txt
      - name: Install modeling engines and witness libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openscad
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps -e .
      - name: Record the actual kernels and dependencies
        run: |
          python scripts/check_env.py | tee out-env.json
          python -m pip freeze > out-dependencies.txt
      - name: Regression tests (no external reference needed)
        run: python -m pytest -q tests
      - name: Run the named-object hybrid experiment
        run: |
          python examples/necrospire/hybrid/hybrid_demo.py --out out/hybrid-ci
          test -s out/hybrid-ci/cad_body.step
          test -s out/hybrid-ci/composite_render.obj
          test -s out/hybrid-ci/hybrid_manifest.json
      - name: Multi-epoch hybrid polymesh control
        run: python examples/necrospire/hybrid/run_hybrid_trial.py --out out/hybrid-trial-ci --epochs 2 --per-epoch 4
      - name: Validate synthetic Pair A constructions
        run: |
          python -m projection_loom validate --project examples/ur/project.json --out out/ur-validation
          python -m projection_loom validate --project examples/brutalist/project.json --out out/brutalist-validation
      - name: Upload CAD and preview receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projection-loom-verified-controls
          path: |
            tools/projection-loom/out-env.json
            tools/projection-loom/out-dependencies.txt
            tools/projection-loom/out/hybrid-ci/**
            tools/projection-loom/out/hybrid-trial-ci/**
            tools/projection-loom/out/ur-validation/**
            tools/projection-loom/out/brutalist-validation/**
          if-no-files-found: warn
          retention-days: 14

  cc0-public-witness:
    name: Public CC0 external source (advisory, unpinned until reviewed)
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.public_reference)
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/projection-loom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/projection-loom/requirements-ci.txt
      - name: Install adapters and OpenSCAD
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openscad
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps -e .
      - name: Fetch CC0 OpenGameArt archive and create review candidate lock
        run: |
          python scripts/fetch_references.py --source brutalism2 \
            --cache out/references --lockfile out/references.lock.review.json \
            --bootstrap-lock
          python scripts/inspect_reference_pack.py \
            --receipt out/references/receipts/brutalism2.json \
            --out out/references/reference-evidence.json
      - name: Upload source-integrity review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projection-loom-cc0-unreviewed-source
          path: |
            tools/projection-loom/out/references.lock.review.json
            tools/projection-loom/out/references/receipts/*.json
            tools/projection-loom/out/references/reference-evidence.json
            tools/projection-loom/out/references/archives/brutalism2.zip
          retention-days: 14
          if-no-files-found: warn

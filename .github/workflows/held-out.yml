name: Held-out witnesses

# The normal CI fleet names these witnesses but cannot raise their browser and Docker substrates.
# This workflow gives each one its own hosted runner: a red civic matrix cannot conceal a red crossing
# matrix, and the fixed `dreamnet-mesh` compose project never has a second writer on the same host.
on:
  schedule:
    - cron: "17 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  held-out:
    name: Held-out · ${{ matrix.driver }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - driver: browser-weld
            timeout_minutes: 60
          - driver: civic
            timeout_minutes: 110
          - driver: crossing
            timeout_minutes: 45
          - driver: herm-mesh
            timeout_minutes: 45
            mesh: "true"
          - driver: mesh-scenarios
            timeout_minutes: 225
            mesh: "true"
    env:
      NODE_VERSION: "24"
      PNPM_VERSION: "11"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # The runner context is unreadable in a job-level env block; the path is computed where it is.
      - name: Prepare held-out evidence directory
        run: |
          dir="$RUNNER_TEMP/held-out/${{ matrix.driver }}"
          mkdir -p "$dir"
          echo "ARTIFACT_DIR=$dir" >> "$GITHUB_ENV"
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      # THE ENGINE BLOB IS A DELIBERATE RENDER, NEVER A BUILD SIDE EFFECT. tw5-core/ stays gitignored because its
      # sha256 IS the hearth's true name, so a fresh checkout holds none until this step renders it from the
      # submodule — and every vessel a driver founds reads the engine it names.
      - name: Render the TW5 core blob
        run: pnpm --filter @lararium/tw5 build:tw5-vendor
      # The Docker files bind-mount this checkout and explicitly trust its host-built dist/. The
      # browser weld also imports the workspace's Playwright package from this install.
      - name: Build the mounted tree
        run: pnpm -r build
      # A STAMP NAMES THE BYTES A BUILD THAT RAN CAME FROM. A step runs only after every earlier step passed, so
      # this stamp never lands over a failed build; an unstamped dist reads stale to every freshness gate, and
      # `lares vessel found` would rebuild mid-driver.
      - name: Stamp the build
        run: node tools/stamp-build.mjs .
      - name: Verify Docker Compose substrate
        run: docker compose version
      - name: Install Playwright Chromium
        if: matrix.driver == 'browser-weld'
        run: pnpm exec playwright install --with-deps chromium

      # Regression for the status bug that held this runner back. The fake Docker seam runs no
      # container and checks both a quiet failed compose result and a quiet successful one.
      - name: Crossing driver preserves a quiet compose verdict
        if: matrix.driver == 'crossing'
        run: node --test tools/crossing-witness.test.mjs
      - name: Browser weld driver preserves its entry contract
        if: matrix.driver == 'browser-weld'
        run: node --test tools/browser-weld-witness.test.mjs
      # The mesh witnesses' readers hold to a known positive: a field the pointer builder stops minting
      # reds here, before a mesh run can read every act as one frozen default.
      - name: Herm mesh readers read a known positive
        if: matrix.driver == 'herm-mesh'
        run: node --test tools/herm-mesh-reader.test.mjs
      - name: Mesh pins stand in the order the compose file derives
        if: matrix.mesh == 'true'
        run: node --test tools/mesh-pins.test.mjs

      # PINS ARE GENERATED, NEVER COPIED. Every bootstrap peer knocks with the gate key its target founded in its
      # own container, so the herms stand one wave at a time and each wave boots against the keys read off the
      # wave before it. A bare `compose up` stands relays whose peer entries carry no key, and those refuse aloud.
      - name: Stand the Herm mesh in pin order
        if: matrix.driver == 'herm-mesh'
        shell: bash
        run: |
          timeout --kill-after=60s 10m node tools/mesh-pins.mjs --up herm-source herm-relay herm-relay-2 2>&1 \
            | tee "$ARTIFACT_DIR/mesh-setup.log"

      - name: Run ${{ matrix.driver }}
        shell: bash
        run: |
          set -uo pipefail
          run_captured() {
            local log="$1"
            shift
            # Signal the owned process group, including Compose/Node children, then bound cleanup.
            timeout --kill-after=60s "$@" 2>&1 | tee "$log"
            statuses=("${PIPESTATUS[@]}")
            [ "${statuses[0]}" -eq 0 ] && [ "${statuses[1]}" -eq 0 ]
          }
          run_logged() {
            run_captured "$ARTIFACT_DIR/driver.log" "$@"
          }
          set +e
          case "${{ matrix.driver }}" in
            browser-weld)
              run_logged 40m bash tools/browser-weld-witness.sh
              status=$?
              ;;
            civic)
              run_logged 85m bash tools/civic-witness.sh
              status=$?
              ;;
            crossing)
              run_logged 25m bash tools/crossing-witness.sh
              status=$?
              ;;
            herm-mesh)
              # PEERS PROVE FIRST: a hop's oracle answers no stranger, so the witness dials as a READER
              # vessel founded in a scratch root. Its own attempt loop waits out the mesh coming up.
              reader_root="$(mktemp -d)"
              if ! run_captured "$ARTIFACT_DIR/reader-found.log" 5m env LAR_ROOT="$reader_root" node packages/lares-cli/bin/lares.mjs vessel found --skip-build; then
                echo "the witness's reader vessel did not found" | tee -a "$ARTIFACT_DIR/driver.log"
                status=1
              else
                LAR_ROOT="$reader_root" WITNESS_ATTEMPTS=120 run_logged 5m bash tools/herm-mesh-witness.sh
                status=$?
              fi
              rm -rf "$reader_root"
              ;;
            mesh-scenarios)
              run_logged 205m bash tools/mesh-scenarios.sh all
              status=$?
              ;;
            *)
              echo "unknown held-out driver: ${{ matrix.driver }}" >&2
              status=2
              ;;
          esac
          exit "$status"

      # A mesh driver's own trap tears down on a clean exit; a job timeout signals past it, so this step holds
      # the evidence and the teardown either way. The pins file names public gate keys only.
      - name: Capture and tear down the mesh
        if: always() && matrix.mesh == 'true'
        shell: bash
        run: |
          cp .mesh-pins.env "$ARTIFACT_DIR/mesh-pins.env" 2>/dev/null || true
          {
            echo "── mesh compose state before teardown ──"
            timeout --kill-after=30s 2m docker compose -f docker-compose.mesh.yml ps
            timeout --kill-after=30s 2m docker compose -f docker-compose.mesh.yml logs --no-color
          } >>"$ARTIFACT_DIR/mesh-compose.log" 2>&1 || true
          timeout --kill-after=60s 5m docker compose -f docker-compose.mesh.yml down -v || true
      - name: Upload held-out evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: held-out-${{ matrix.driver }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 14

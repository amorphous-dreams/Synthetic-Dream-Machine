name: CI

# Golden-principle gates for the Lararium monorepo, mapped to the project's
# domains + models (web3 local-first · causal-islands · the meme graph):
#   typecheck       — every package's types hold
#   build-freshness — `build` is deterministic AND emits no stale tracked source:
#                     the checked-in generated plugin artifacts must match a fresh
#                     build (the canonical "regenerate + git diff --exit-code" gate;
#                     catches a hand-edited / forgotten-regen generated file)
#   test            — every package's suite, incl. the meme round-trip laws
#                     (meme-corpus-roundtrip) and the plugin-artifact parity gate
#   witnesses       — the whole `tools/*witness*.sh` fleet through `witness-all`, under its own
#                     name so a red suite cannot swallow it; the docker/browser hold-outs are
#                     named with their reasons in the job's log
#   e2e             — the residency/ingest witnesses through the real CLI + vessels
#   boot-budget     — the cache-stable boot stays under its char ceiling
#   pristine-upstream — the meme routes meet a PUBLISHED tiddlywiki (npm), not only the fork:
#                     the plugin drops into stock, and the log names the version it met
#
# Defense-in-depth, not a single flag: build-freshness (CI, authoritative) is
# backed by the always-on plugin-artifact-parity unit test in `test` (local-first,
# runs in every `pnpm test`). Dropping one gate does not open the hole.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11"
  # The published tiddlywiki the plugin proves it drops into (the `pristine-upstream` job). ONE
  # version, one place: the job's name, its cache key, its pack and its log-line check all read it.
  TW5_PRISTINE: "5.4.1"

jobs:
  # ─── typecheck ────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # TiddlyWiki5 IS the vendored-core build input and mempalace IS the python import
          # root. Without them the tw5 build cannot run, so every downstream job fails on an
          # artifact the repo never had a chance to produce.
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `@lararium/mesh` publishes its subpaths (`./lar-uris`, `./harvest`, …) into a GITIGNORED
      # dist/, so `tsc` cannot resolve a single one of them on an unbuilt tree. Locally the tree is
      # always built, which is why this passed on every desk and failed on every runner.
      - name: Build (typecheck resolves workspace subpaths through dist/)
        run: pnpm -r build
      # A range in a manifest is a version nobody chose. This costs no build, so it rides the cheapest
      # job and fails before anything downstream spends time on a tree whose bytes are not pinned.
      - name: Every dependency names ONE version
        run: tools/exact-deps-witness.sh
      - name: Typecheck all packages
        run: pnpm -r typecheck

  # ─── build + generated-artifact freshness ─────────────────────────────────
  build-freshness:
    name: Build + generated freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # TiddlyWiki5 IS the vendored-core build input and mempalace IS the python import
          # root. Without them the tw5 build cannot run, so every downstream job fails on an
          # artifact the repo never had a chance to produce.
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: pnpm -r build
      - name: Generated artifacts must be fresh (build emits no tracked diff)
        run: |
          if ! git diff --quiet; then
            echo "::error::A fresh build changed tracked files — committed generated artifacts are stale."
            echo "Regenerate and commit them: pnpm --filter @lararium/tw5 build"
            git --no-pager diff --stat
            git --no-pager diff
            exit 1
          fi
          echo "Generated artifacts are fresh."

  # ─── test (all package suites) ─────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # TiddlyWiki5 IS the vendored-core build input and mempalace IS the python import
          # root. Without them the tw5 build cannot run, so every downstream job fails on an
          # artifact the repo never had a chance to produce.
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Eight suites guard on `existsSync` of tw5-core/ and dist/ — both gitignored build output.
      # Unbuilt, they SKIP and the job still exits 0, so the run reads green while 35 tests never ran.
      - name: Build (suites guard on built artifacts and silently skip without them)
        run: pnpm -r build
      # THE HOLDER IS A DEPENDENCY, NOT AN OPTIONAL EXTRA. `content-palace` drives the python
      # mempalace holder live, and with no interpreter holding it the suite fails on an absent
      # dependency rather than on anything about the code. Skipping it instead would be worse:
      # absence-of-finding and absence-of-looking read identically in a green run.
      #
      # ONE VENV — `~/.venv`, the same path `spawn-resolve` probes and `lares vessel stand --install`
      # stands. A venv anywhere else is an interpreter with different powers, which is the whole
      # hazard that rule exists to close.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache the holder venv
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: ~/.venv
          key: holder-venv-${{ runner.os }}-py312-${{ hashFiles('mempalace/pyproject.toml') }}
      - name: Stand the holder venv (~/.venv)
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv ~/.venv
          ~/.venv/bin/python3 -m pip install --upgrade pip
          ~/.venv/bin/python3 -m pip install -e ./mempalace
      - name: Witness the holder answers
        run: ~/.venv/bin/python3 -c "import mempalace; print('holder ok')"
      - name: Install Playwright Chromium (browser-vessel suite)
        run: pnpm exec playwright install --with-deps chromium
      # ONE SERIALIZATION, BOTH PLACES. The root `test` script pins `--workspace-concurrency=1`
      # because packages share a build tree and a rendezvous directory; running them in parallel
      # measures a different repository than the one an operator measures locally, and its flakes
      # are unreproducible by construction.
      - name: Run all package suites
        run: pnpm test

  # ─── witnesses (the whole fleet, under its own name) ───────────────────────
  # THE FLEET RODE INSIDE `test`, WHICH IS A PLACE IT CAN BE HIDDEN. `witness-all` exists because
  # chaining gates with `&&` lets the first red swallow every one after it; a step that runs AFTER
  # `pnpm test` in the same job inherits exactly that failure — one red suite and the whole fleet (34 `tools/*witness*.sh` files at this writing — the glob reads the live count)
  # witnesses never run, and the PR shows one red where there were two questions. Its own job asks
  # the fleet's question whatever the suites answer.
  #
  # WHAT THIS JOB CAN HONESTLY RUN: the witnesses `tools/*witness*.sh` globs (34 files at this writing — never a hand count) minus the
  # declared hold-outs. They need node, a pnpm install, python3 (domain-registry · exact-deps ·
  # meme-coordinates · mesh-coverage · mirror-parity · rendezvous-parity · rite-commands ·
  # surface-parity) and a BUILT tree — `frame-shape`, `surface-parity`, `rite-commands` and
  # `meme-check-hook` all read dist/ and refuse (or skip) without it.
  #
  # WHAT IT MUST SKIP, AND WHY: the five hold-outs `witness-all.sh` declares in HELD_OUT — civic ·
  # crossing · herm-mesh · mesh-scenarios stand docker-compose meshes this runner does not raise,
  # and browser-weld drives a real browser against a standing app. The script prints each one with
  # its reason under `── held out of this run ──`, so the skip is named IN THIS JOB'S LOG rather
  # than in a comment nobody reads; the step below fails if that roll call is missing, because a
  # skip that stops announcing itself is the silence these witnesses exist to break.
  witnesses:
    name: Witnesses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # TiddlyWiki5 IS the vendored-core build input and mempalace IS the python import
          # root. Without them the tw5 build cannot run, so every downstream job fails on an
          # artifact the repo never had a chance to produce.
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      # Four witnesses read dist/ and one founds a vessel from the built CLI. Unbuilt they refuse or
      # skip, and a skip reads green — the exact shape this job exists to close.
      - name: Build (the fleet measures the built tree)
        run: pnpm -r build
      - name: Run every witness (never short-circuits; the worst exit wins)
        run: |
          set -o pipefail
          tools/witness-all.sh 2>&1 | tee "$RUNNER_TEMP/witnesses.log"
      # THE ROLL CALL IS PART OF THE VERDICT. A held-out witness that stops naming itself has become
      # an unmeasured gate wearing a green check.
      - name: The held-out witnesses are named in this log
        if: always()
        run: |
          if ! grep -q "held out of this run" "$RUNNER_TEMP/witnesses.log"; then
            echo "::error::the run named no held-out witnesses — the fleet's own roll call went silent"
            exit 1
          fi
          sed -n '/held out of this run/,$p' "$RUNNER_TEMP/witnesses.log"

  # ─── e2e (residency / ingest witnesses) ────────────────────────────────────
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # TiddlyWiki5 IS the vendored-core build input and mempalace IS the python import
          # root. Without them the tw5 build cannot run, so every downstream job fails on an
          # artifact the repo never had a chance to produce.
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (vessels run from dist)
        run: pnpm -r build
      - name: Run e2e suite
        run: pnpm test:e2e
        timeout-minutes: 10

  # ─── boot budget (cache-stable boot ceiling) ───────────────────────────────
  boot-budget:
    name: Boot budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # TiddlyWiki5 IS the vendored-core build input and mempalace IS the python import
          # root. Without them the tw5 build cannot run, so every downstream job fails on an
          # artifact the repo never had a chance to produce.
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: noosphere-boot.mem must stay under the 40000-char ceiling
        run: |
          node -e '
            const fs = require("node:fs");
            const p = "bags/lares/ha.ka.ba/lares/api/noosphere-boot.mem";
            // A MISSING SEED IS ITS OWN FAULT, NEVER A BUDGET ONE. This gate read a path with a doubled
            // `lares/` segment — left behind by the ha.ka.ba reshuffle — so it threw ENOENT and reported
            // as a budget failure for two days while the seed sat 34 code points UNDER the ceiling.
            if (!fs.existsSync(p)) {
              console.error("::error::" + p + " does not exist — the budget gate cannot measure a seed it cannot find.");
              process.exit(1);
            }
            // CODE POINTS, never bytes: the seed carries sigils, Hawaiian and Devanagari, so a byte count
            // reads ~480 high and would send a reader trimming prose that was never over.
            const n = [...fs.readFileSync(p, "utf8")].length;
            console.log("boot code points:", n, "/ 40000");
            if (n >= 40000) {
              console.error("::error::" + p + " is " + n + " chars — over the cache-stable boot budget (40000). Reclaim before editing.");
              process.exit(1);
            }
          '

  # ─── pristine upstream (the plugin drops into a PUBLISHED tiddlywiki) ──────
  # THE INSTRUMENT AND ITS INVOKER. `meme-routes.e2e` takes `LARES_TW5_JS` and runs the whole
  # contact — PUT · GET · DELETE · memes.json · the native door · the readers/writers case · the
  # `--render` door — against any `tiddlywiki.js`. The `test` job runs it against the FORK
  # (the submodule); nothing ran it against the published line, so "the plugin drops into stock"
  # stood as an operator's local measurement. This job is its invoker, and it stands ALONE so the
  # verdict reads on the PR under its own name rather than inside a job that measures the fork.
  #
  # THE SUITE SKIPS LOUDLY WHEN ITS ENGINE IS MISSING, AND A SKIP READS GREEN. So the job greps the
  # contact line for the pinned version: a run that met no engine, or met the wrong one, fails here
  # even though vitest exited 0.
  pristine-upstream:
    name: Pristine upstream (tiddlywiki@${{ env.TW5_PRISTINE }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The packed plugin builds from the vendored core; the contact itself runs against npm's.
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (the packed plugin is what drops into stock)
        run: pnpm -r build
      # ONE VERSION, ONE PLACE. The tarball caches by the pinned version; a bump re-packs.
      - name: Cache the published tiddlywiki
        id: pristine-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/lares-pristine/tiddlywiki-${{ env.TW5_PRISTINE }}
          key: pristine-tiddlywiki-${{ env.TW5_PRISTINE }}
      - name: Pack tiddlywiki@${{ env.TW5_PRISTINE }} from npm
        if: steps.pristine-cache.outputs.cache-hit != 'true'
        run: |
          dir=~/.cache/lares-pristine/tiddlywiki-$TW5_PRISTINE
          mkdir -p "$dir" && cd "$dir"
          npm pack "tiddlywiki@$TW5_PRISTINE" --silent
          tar xzf "tiddlywiki-$TW5_PRISTINE.tgz"
      - name: Witness the engine is the one pinned
        run: |
          pkg=~/.cache/lares-pristine/tiddlywiki-$TW5_PRISTINE/package
          test -f "$pkg/tiddlywiki.js"
          node -e 'const v=require(process.argv[1]+"/package.json").version; console.log("pristine engine: tiddlywiki@"+v); if(v!==process.env.TW5_PRISTINE){console.error("::error::packed "+v+", pinned "+process.env.TW5_PRISTINE);process.exit(1)}' "$pkg"
      - name: meme-routes contact against the pristine engine
        run: |
          export LARES_TW5_JS=~/.cache/lares-pristine/tiddlywiki-$TW5_PRISTINE/package/tiddlywiki.js
          export LARES_E2E_TMP="$RUNNER_TEMP/pristine-e2e"
          pnpm --filter @lararium/tw5 exec vitest run tests/meme-routes.e2e.test.ts 2>&1 | tee "$RUNNER_TEMP/pristine.log"
          test "${PIPESTATUS[0]}" -eq 0
      - name: The log names the engine it met
        run: |
          line=$(grep -a "meme-routes.e2e: contact with TiddlyWiki" "$RUNNER_TEMP/pristine.log" || true)
          echo "$line"
          if ! grep -aq "contact with TiddlyWiki $TW5_PRISTINE " "$RUNNER_TEMP/pristine.log"; then
            echo "::error::the contact never named tiddlywiki@$TW5_PRISTINE — the suite skipped or met another engine"
            exit 1
          fi

  # ─── grammar artifact (ship step 0: the quad-pinned carrier stays truth) ───
  grammar-artifact:
    name: Grammar artifact gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # TiddlyWiki5 IS the vendored-core build input and mempalace IS the python import
          # root. Without them the tw5 build cannot run, so every downstream job fails on an
          # artifact the repo never had a chance to produce.
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Install py host deps
        run: pip install tree-sitter pytest pygls
      - name: generate-parity — the committed parser.c stays the truth
        working-directory: packages/tree-sitter-memetic-wikitext
        run: pnpm run gate:generate-parity
      - name: fold + golden manifest gates (py host)
        working-directory: packages/tree-sitter-memetic-wikitext
        run: pnpm run gate:fold
      # TWO HOSTS, TWO GATES. `gates` chains all three with `&&`; this job named two of them and the
      # TS host's fold + parity ran nowhere. Kept as its own step rather than folded into the chain,
      # so a red in the py host cannot hide a red here.
      - name: fold + parity gates (ts host)
        working-directory: packages/tree-sitter-memetic-wikitext
        run: pnpm run gate:fold-ts
      - name: wasm builds under the pinned CLI
        working-directory: packages/tree-sitter-memetic-wikitext
        run: pnpm run build:wasm

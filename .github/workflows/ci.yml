name: CI

# The pinned Playwright image supplies Node 26 for the browser cells (dim for now: tools/ci-cells.mjs BROWSER_LAMPS_DIM); the other jobs pin Node 24.
# The browser import boundary must keep product code compatible with Node 24.

# Golden-principle gates for the Lararium monorepo, mapped to the project's
# domains + models (web3 local-first · causal-islands · the meme graph).
#
# A FULL RUN RAISES AT MOST TEN JOBS AT ONCE (tools/ci-graph.test.mjs reads this file and the called e2e workflow), so a
# second full run starts beside it inside the account's twenty running jobs:
#   scope           — one small read, beside quick and ahead of every cell: whether this push changes canon alone
#                     (tools/ci-ignored-paths.json), and on a lane which packages, test cells and witness cells it runs
#   quick           — build + generated-artifact freshness (the checked-in plugin artifacts — the lar:// canonical copy AND
#                     the `$:/` standalone distribution — must match a fresh build), typecheck, the exact-deps witness, the
#                     the seed presence check (the hooks load the boot seed whole), the grammar artifact gates, the
#                     pristine upstream (the meme routes meet a PUBLISHED tiddlywiki, against the COMMITTED standalone
#                     artifact; the browser floor crossing and the stock single-file build stand dim), then the contract witness cell
#   test            — every package's suite as four cells (node dealt across two by file weight), incl. the meme
#                     round-trip laws and the two plugin-artifact parity gates (lar:// + the standalone `$:/` distribution)
#   witnesses       — the whole `tools/*witness*.sh` fleet through `witness-all`, under its own name so a red suite cannot
#                     swallow it; the docker/browser hold-outs are named with their reasons in the job's log; beside it,
#                     every `tools/*.test.mjs` self-test the instruments carry
#   e2e             — every e2e set through the real CLI + vessels, sharded: this workflow calls `e2e-shards.yml` and takes
#                     its merge gate's verdict
#
# ONE RUN PER SHA. A push to a branch and a pull request from the same repository name one sha, so the push owns it and
# every job stands guarded off on the same-repository `pull_request` event; a fork's pull request has no push here and runs
# whole. The native merge queue on `develop` raises `merge_group` on each group's merge commit, and every job runs there
# (the fork guard reads `pull_request` alone): the queue's run reads a lane on top of every lane queued ahead of it.
#
# A LANE RUNS WHAT IT TOUCHES, THE FORD RUNS FULL (the operator's rulings, 2026-11-18 and 2026-11-19). A code push to a LANE
# branch (`develop--*`, `lane/*`) runs the Quick gates, the test cells over the packages its diff touches, and the Test gate;
# the e2e shards stand guarded off and the e2e merge gate answers on its doorstep step (e2e-shards.yml's `doorstep` input).
# The scope job (tools/ci-ignored-paths.mjs `laneScope`) reads the lane's diff against its merge base with develop:
#   packages  — each path under `packages/<dir>/`, `tests/` or `TiddlyWiki5` names its workspace package, closed over every
#               in-repo package whose package.json depends on it (`workspace:`), so a mesh change reaches tw5, node, web, cli...
#   cells     — the test cells (TEST_CELLS in tools/ci-cells.mjs) holding a selected package. Every matrix row still raises
#               (a job-level `if:` cannot read the matrix), and a row the selection leaves out skips every step behind
#               `contains(needs.scope.outputs.cells, matrix.cell)`; a running row walks its selected packages alone, and the
#               Test gate owes their reports alone (`--select`).
#   witnesses — the witness cells and their gate run on a lane when canon moved beside code, when a source genesis carries moved
#               (`isGenesisSource`: the engine's inputs, a packed plugin file), or when the full battery runs.
# FAIL OPEN TO MORE, NEVER FEWER: a path outside every package dir (tools/, the workflows, the root package.json or lockfile, a
# non-meme file under bags/), a package no test cell carries, an unread diff or graph selects the full battery (`packages=all`).
# The full battery runs unchanged on `merge_group`, on a push to `develop` or `main` (and any other branch, a feature span's
# among them), on a fork's pull request, and by `workflow_dispatch` for a lane that wants a whole reading before it queues.
# The four checks the `develop` ruleset requires still report on a lane head: `Quick gates` and `Test` run; `Witnesses` runs
# or reports skipped (GitHub reads a skipped required check as passing); `E2E / Merge shard reports` runs its one doorstep
# step and passes, because a called job's check bears that name only while the caller runs. tools/ci-graph.test.mjs (D1-D3)
# holds the run law and tools/ci-ignored-paths.test.mjs the selection.
#
# THE CANON DOORSTEP. A push that changes only the canon paths tools/ci-ignored-paths.json names (meme, docs, wikis) runs
# the doorstep set alone, on a lane or on `develop`/`main` alike: the scope job reads the push's diff against that one list
# (develop and main against the push's own `before`, any other branch against its merge base with develop) and hands on
# `canon`, and every job a lane push skips reads it beside the lane test. The push trigger ignores no path: a trigger filter
# cannot vary by branch and stops the run before any job is read, so a canon pull request never saw its four required
# checks and could not enter the queue (PR #242). A canon pull request reports all four and enqueues; a canon push to
# `develop` costs the scope read, the Quick gates and the doorstep step, never the battery. A mixed push reads as code,
# and `merge_group`, dispatch and a fork's pull request run whole whatever the scope reads. A scope that cannot read the
# push answers code. tools/ci-graph.test.mjs (D4-D6) and tools/ci-ignored-paths.test.mjs hold it.
# Defense-in-depth, not a single flag: build-freshness (CI, authoritative) is
# backed by the always-on plugin-artifact-parity unit test in `test` (local-first,
# runs in every `pnpm test`). Dropping one gate does not open the hole.

on:
  push:
    # `branches` and `branches-ignore` cannot both sit under the same `push:` event (GitHub
    # workflow syntax), so this replaces the blanket `branches: ["**"]` rather than sitting beside
    # it — the two names mean the same "every branch" before the exclusion.
    #
    # A lane push to `ci/<lane>` is e2e-shards.yml's own single-fire trigger (tools/e2e-shards.mjs
    # pushes it and watches that ONE run). Without this exclusion the same push would also raise the
    # whole full-CI matrix here — two answers to one push, and the shard lane's point (a cheap,
    # throwaway proof run) would cost a full CI run every time.
    #
    # The merge queue pushes each group to `gh-readonly-queue/<base>/...` and raises `merge_group` on that same sha; skipping
    # those refs here leaves the group ONE run, the merge_group one the queue waits on.
    branches-ignore: ["ci/**", "gh-readonly-queue/**"]
    # NO `paths-ignore`: a canon-only push raises a run and its scope job answers it with the doorstep (THE CANON DOORSTEP,
    # above). tools/ci-ignored-paths.test.mjs holds the trigger free of it.
  pull_request:
    branches: [develop, main]
  # THE MERGE QUEUE. A lane lands as a pull request into `develop` that enters the queue (the repository ruleset on `develop`
  # names the queue and its required checks); the queue builds each group on top of the groups ahead of it and raises
  # `merge_group` on the group's merge commit. That run raises the same ten jobs a push does, and on green the queue moves
  # `develop` to that exact sha. The scope job reads a push alone, so a group of canon-only lanes still raises a full run
  # here: a canon pull request enqueues on its doorstep checks, and canon may still go direct (tools/span-push.mjs).
  # held-out.yml answers the push of the group's merge onto `develop`, not the queue.
  merge_group:
    types: [checks_requested]
    branches: [develop]
  # A controller runs CI by hand on a lane head that wants a whole reading before it queues: a lane push, canon or code,
  # runs the doorstep alone, and the land guard reads a head's verdict, not its ancestor's alone.
  workflow_dispatch:

# A newer push to a lane or a feature span supersedes its older run. On `develop` and `main` the run in flight finishes: a
# canon push there raises a run of its own (THE CANON DOORSTEP), and its doorstep must never cancel the battery a
# code push before it raised, the way a canon push that raised no run never did (tools/span-push.mjs pushes canon on it).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}

jobs:
  # ─── scope (does this push change canon alone? ONE small runner, beside quick) ───────────────
  # It reads the push through tools/ci-ignored-paths.mjs, the one list's own module, off the runner's GITHUB_* variables and
  # event file, and names a lane's selection (`packages`, `cells`, `witnesses`; A LANE RUNS WHAT IT TOUCHES, above). Every job a canon-only push skips lists it in `needs` (Actions hands a job its direct needs' outputs alone;
  # tools/workflow-law.test.mjs WL6 holds that); quick does not wait on it. On any event but a push it answers `false`.
  scope:
    name: Scope
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      canon: ${{ steps.read.outputs.canon }}
      packages: ${{ steps.read.outputs.packages }}
      cells: ${{ steps.read.outputs.cells }}
      witnesses: ${{ steps.read.outputs.witnesses }}
      playwright: ${{ steps.image.outputs.playwright }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The reader opens tools/ci-ignored-paths.{mjs,json} and asks git for the rest; no other file of the tree.
          sparse-checkout: tools
      - name: Read the Node floor (package.json engines.node)
        id: node
        # The floor major of package.json `engines.node`; setup-node would take the newest release of a `>=` range.
        run: echo "major=$(node -p "/\\d+/.exec(require('./package.json').engines.node)[0]")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.major }}
      - name: Read the pinned Playwright image (docker-compose.capability-probe.yml)
        id: image
        run: echo "playwright=$(tools/pw-container.sh --pin)" >> "$GITHUB_OUTPUT"
      - name: Read whether this push changes canon alone (tools/ci-ignored-paths.json)
        id: read
        run: node tools/ci-ignored-paths.mjs scope >> "$GITHUB_OUTPUT"

  # ─── quick (six small gates and the contract witness, ONE runner) ─────────────────────────
  # THE ACCOUNT RUNS ABOUT TWENTY JOBS AT ONCE, and a full run raises at most TEN (tools/ci-graph.test.mjs holds this file to
  # it), so a second full run starts beside the first. The six small gates that each held a runner of their own (build +
  # freshness 1 min, typecheck 1, pristine upstream 1.4, seed presence 0.5, grammar artifact gates 1.1, floor crossing 2.7: run
  # 41280151942) now share ONE checkout, install and build, and the contract witness rides behind them. Every step keeps its
  # own name and runs whatever the steps before it answered (`!cancelled()`), so one red gate never hides another and the job
  # reads red by step name. The contract witness uploads `witness-cell-contract-witness` as its own cell, so the Witnesses
  # gate keys on that name wherever the cell runs.
  quick:
    name: Quick gates
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # TiddlyWiki5 IS the vendored-core build input and mempalace IS the python import
          # root. Without them the tw5 build cannot run, so every downstream job fails on an
          # artifact the repo never had a chance to produce.
          submodules: recursive
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Read the Node floor (package.json engines.node)
        id: node
        # The floor major of package.json `engines.node`; setup-node would take the newest release of a `>=` range.
        run: echo "major=$(node -p "/\\d+/.exec(require('./package.json').engines.node)[0]")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.major }}
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # THE NODE FLOOR, NAMED. A plain TW5 server evaluates modules in a sandbox carrying none of
      # TextEncoder/TextDecoder/crypto; `host-globals-lend.ts` lends the host's own copies through
      # `process.getBuiltinModule` (Node >=24) and silently no-ops without it. Absent, the meme laws' hashing dies
      # deep inside the contact as a bare "TextEncoder is not defined"; this step names the real floor first.
      - name: Node floor — process.getBuiltinModule must be present
        run: |
          node -e '
            if (typeof process.getBuiltinModule !== "function") {
              console.error("::error::Node " + process.version + " lacks process.getBuiltinModule — the plugin cannot lend TextEncoder/TextDecoder/crypto into the stock TW5 sandbox (host-globals-lend.ts). Pin Node >=24 (root package.json engines); below that floor the hashing paths fail deep in the contact as a bare \"TextEncoder is not defined\".");
              process.exit(1);
            }
            console.log("process.getBuiltinModule present on " + process.version);
          '
      - run: pnpm install --frozen-lockfile
      # `@lararium/mesh` publishes its subpaths into a GITIGNORED dist/, so `tsc` resolves none of them on an unbuilt tree.
      # THE ENGINE BLOB IS A DELIBERATE RENDER, NEVER A BUILD SIDE EFFECT: tw5-core/ stays gitignored because its sha256 IS the
      # hearth's true name, so `build` refuses to render it. The root `build` stamps the source digest after `pnpm -r build`.
      - name: Render the TW5 core blob
        run: pnpm --filter @lararium/tw5 build:tw5-vendor
      - name: Build all packages
        id: build
        run: pnpm build
      # A range in a manifest is a version nobody chose. This costs no build.
      - name: Every dependency names ONE version
        if: ${{ !cancelled() }}
        run: tools/exact-deps-witness.sh
      # A misspelt trailer key drops a record line silently (`Braking:` renders nowhere in tools/changelog-render.mjs). The
      # checkout stands shallow, so this step alone fetches the base's history (no blobs) and reads the range from the merge
      # base. A push to develop itself reads an empty range. This costs no build.
      - name: Every trailer key names a known key
        if: ${{ !cancelled() }}
        run: |
          git fetch --no-tags --no-recurse-submodules --filter=blob:none --unshallow origin "${{ github.base_ref || 'develop' }}"
          node tools/trailer-keys.mjs "$(git merge-base FETCH_HEAD HEAD)..HEAD"
      - name: Generated artifacts must be fresh (build emits no tracked diff)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          if ! git diff --quiet; then
            echo "::error::A fresh build changed tracked files — committed generated artifacts are stale."
            echo "Regenerate and commit them: pnpm --filter @lararium/tw5 build"
            git --no-pager diff --stat
            git --no-pager diff
            exit 1
          fi
          echo "Generated artifacts are fresh."
      - name: Typecheck all packages
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm -r typecheck
      # `pnpm -r typecheck` reads source alone (every tsconfig.json excludes tests/), and vitest's esbuild checks no
      # types, so each package's tests typecheck here against its ceiling (tools/typecheck-tests-baseline.json): new
      # drift reads red, the standing drift burns down, and the witness turns --strict once every ceiling reads zero.
      - name: Typecheck every package's tests (ratchet)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: tools/typecheck-tests-witness.sh
      - name: noosphere-boot.mem stands where the hooks load it
        if: ${{ !cancelled() }}
        run: |
          # The single quotes hold a node program whole: its backticks are JavaScript, never the shell's.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const p = "bags/lares/ha.ka.ba/lares/api/noosphere-boot.mem";
            // A MISSING SEED IS ITS OWN FAULT, NEVER A BUDGET ONE.
            if (!fs.existsSync(p)) {
              console.error("::error::" + p + " does not exist — the hooks load the seed from here, and nothing stands to load.");
              process.exit(1);
            }
            // NO BUDGET CLAUSE (operator, 2026-11-01: "We can exceed the 40K ceiling if needed, as we now
            // deterministically load the boot seed via hooks."). The seed is read whole by the hooks; this
            // step keeps only the fault a budget never answered: a seed that is not there.
            console.log("boot code points:", [...fs.readFileSync(p, "utf8")].length);
          '
      # ── grammar artifact (ship step 0: the quad-pinned carrier stays truth) ──
      # The py host's three imports, each at the version the house venv runs, so this gate measures the same runtime the operator does.
      - name: Install py host deps
        if: ${{ !cancelled() }}
        run: pip install tree-sitter==0.26.0 pytest==9.1.1 pygls==2.1.1
      - name: generate-parity — the committed parser.c stays the truth
        if: ${{ !cancelled() }}
        working-directory: packages/tree-sitter-memetic-wikitext
        run: pnpm run gate:generate-parity
      - name: fold + golden manifest gates (py host)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: packages/tree-sitter-memetic-wikitext
        run: pnpm run gate:fold
      # THE TS HOST LOADS THE WASM, SO THE WASM BUILDS FIRST. `*.wasm` is gitignored; a runner holds none until `build:wasm`
      # emits it. The contract witness below needs the same wasm and the stamp this strikes.
      - name: wasm builds under the pinned CLI
        id: wasm
        if: ${{ !cancelled() }}
        working-directory: packages/tree-sitter-memetic-wikitext
        run: pnpm run build:wasm
      - name: fold + parity gates (ts host)
        if: ${{ !cancelled() && steps.wasm.outcome == 'success' }}
        working-directory: packages/tree-sitter-memetic-wikitext
        run: pnpm run gate:fold-ts
      # ── the browser lamps stand dim (operator, 2026-11-20) ──
      # "disable all browser tests for now, while we move quickly to settle the road": the Chromium pull and the browser floor
      # crossing (W23: `packages/lararium-web/vitest.crossing.config.ts`, files kept in the tree) rode here and ride no more.
      # The whole account stands in tools/ci-cells.mjs (BROWSER_LAMPS_DIM) with how to relight.
      # ── pristine upstream (the plugin drops into a PUBLISHED tiddlywiki) ──
      # THE INSTRUMENT AND ITS INVOKER. `meme-routes.e2e` takes `LARES_TW5_JS` and runs the whole contact against any
      # `tiddlywiki.js`; the package suites run it against the FORK. THE SUITE SKIPS LOUDLY WHEN ITS ENGINE IS MISSING, AND A
      # SKIP READS GREEN, so the step greps the contact line for the pinned version.
      # THE COMMITTED ARTIFACT, NOT A FRESH REBUILD: the pristine engine meets the TRACKED `$:/` distribution. This block runs
      # after the freshness gate, which already proved a fresh build and the tracked copy agree.
      - name: Stamp the dependency build for the pristine suites
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tools/stamp-build.mjs .
      - name: Point dist-plugin at the committed standalone artifact
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cp packages/lararium-tw5/plugins/standalone/lares-memetic-wikitext.tid packages/lararium-tw5/dist-plugin/lares-memetic-wikitext.tid
      # THE PUBLISHED ENGINE IS A DEPENDENCY. `tiddlywiki-pristine` (packages/lararium-tw5 devDependencies, an npm alias of the stock
      # release) lands in the lockfile with its integrity hash and in the install above; the contact reads its version off the
      # installed package, so nothing here restates it.
      - name: Witness the pristine engine is the installed alias
        if: ${{ !cancelled() }}
        run: |
          dir=$(node -p "require('path').dirname(require.resolve('tiddlywiki-pristine/tiddlywiki.js', { paths: ['packages/lararium-tw5'] }))")
          test -f "$dir/tiddlywiki.js"
          node -p "'pristine engine: tiddlywiki@' + require(process.argv[1] + '/package.json').version" "$dir"
      - name: meme-routes contact against the pristine engine
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          export LARES_TW5_JS=$(node -p "require.resolve('tiddlywiki-pristine/tiddlywiki.js', { paths: ['packages/lararium-tw5'] })")
          export LARES_E2E_TMP="$RUNNER_TEMP/pristine-e2e"
          mkdir -p "$LARES_E2E_TMP"
          cd packages/lararium-tw5
          npx vitest run tests/meme-routes.e2e.test.ts 2>&1 | tee "$RUNNER_TEMP/pristine.log"
          test "${PIPESTATUS[0]}" -eq 0
      - name: The log names the engine it met
        if: ${{ !cancelled() }}
        run: |
          line=$(grep -a "meme-routes.e2e: contact with TiddlyWiki" "$RUNNER_TEMP/pristine.log" || true)
          echo "$line"
          dir=$(node -p "require('path').dirname(require.resolve('tiddlywiki-pristine/tiddlywiki.js', { paths: ['packages/lararium-tw5'] }))")
          version=$(node -p "require(process.argv[1] + '/package.json').version" "$dir")
          if ! grep -aq "contact with TiddlyWiki $version " "$RUNNER_TEMP/pristine.log"; then
            echo "::error::the contact never named tiddlywiki@$version — the suite skipped or met another engine"
            exit 1
          fi
      # ── the contract witness (the hosted witness cell `contract-witness`; WITNESS_CELLS in tools/ci-cells.mjs) ──
      - name: Run the hosted witness cell contract-witness
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.wasm.outcome == 'success' }}
        run: node tools/ci-cells.mjs run-witness contract-witness --out "$RUNNER_TEMP/cell"
      - name: Upload the hosted cell's log (always, even on a red cell)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: witness-cell-contract-witness
          path: ${{ runner.temp }}/cell/
          retention-days: 14
          if-no-files-found: warn

  # ─── test (all package suites, as cells) ───────────────────────────────────
  # EACH CELL IS A SLICE OF THE SUITES ON A RUNNER OF ITS OWN, and the slowest cell sets the wall clock. The slices are
  # the table `TEST_CELLS` in tools/ci-cells.mjs: node dealt across two cells by file weight (vitest's own shard measured worse; see TEST_CELLS), the other
  # packages grouped into two cells by weight. FEW CELLS: every cell repeats checkout, install and build, and the lanes share one capped
  # runner pool, so total job-minutes decides, with each run's critical path held near the slowest e2e shard. Every cell is self-contained (its own checkout, install, build, holder venv and engines) and uploads
  # one JSON report per package; the reports double as the per-file timings that name the slowest files. The job
  # named `Test` below is the gate: it fails closed on any missing, empty, red or unexpected cell.
  test-cells:
    name: Test cell ${{ matrix.cell }}
    needs: scope
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork) && !(github.event_name == 'push' && (needs.scope.outputs.canon == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: ${{ matrix.container }}
    env:
      # The keep's session parity (KS5) needs rsync and zstd, which the Playwright image lacks and uid 1001 cannot install;
      # the witness cell `rest` (a bare runner) installs them and runs KS5, and the cli-mesh cell names it so.
      LARES_KS5_RUNS_IN: ${{ matrix.cell == 'cli-mesh' && 'witness-cell-rest' || '' }}
    strategy:
      # A red cell must never cancel its siblings: the gate needs every cell's answer to tell one red
      # from one that never got to answer.
      fail-fast: false
      matrix:
        include:
          # `engines` names the Playwright engines the cell's suites launch (measured against the suite configs:
          # node holds none; `@lararium/web` runs all three and tw5's e2e walks launch Chromium; `@lararium/browser`
          # runs Chromium and Firefox). An empty value runs the cell on the bare runner. A cell that names engines also names
          # `container`, the pinned official Playwright image (read off docker-compose.capability-probe.yml by the scope job, `needs.scope.outputs.playwright`; a job container cannot read
          # `env`), so the system libraries and the engines are already there and no apt or download step runs. `--ipc=host`
          # keeps Chromium off the container's 64 MB /dev/shm. `--user 1001` is the runner's uid and the image's `pwuser`: the
          # steps run as the workspace's owner (git trusts the tree; Firefox refuses to run as root over a home it does not own).
          - cell: node-a
            engines: ''
          - cell: node-b
            engines: ''
          # THE BROWSER LAMPS STAND DIM (operator, 2026-11-20; tools/ci-cells.mjs BROWSER_LAMPS_DIM): no cell names engines or the
          # Playwright container now. To relight, restore `engines: chromium firefox webkit` on web-tw5 and `engines: chromium firefox`
          # on cli-mesh, each with `container: { image: "${{ needs.scope.outputs.playwright }}", options: "--ipc=host --init --user 1001" }`.
          - cell: web-tw5
            engines: ''
          - cell: cli-mesh
            engines: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ contains(needs.scope.outputs.cells, matrix.cell) }}
        with:
          # No suite or witness reads git history, so the default shallow checkout stands.
          # TiddlyWiki5 IS the vendored-core build input and mempalace IS the python import
          # root. Without them the tw5 build cannot run, so every downstream job fails on an
          # artifact the repo never had a chance to produce.
          submodules: recursive
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ contains(needs.scope.outputs.cells, matrix.cell) }}
      - name: Read the Node floor (package.json engines.node)
        id: node
        # The floor major of package.json `engines.node`; setup-node would take the newest release of a `>=` range.
        run: echo "major=$(node -p "/\\d+/.exec(require('./package.json').engines.node)[0]")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ contains(needs.scope.outputs.cells, matrix.cell) }}
        with:
          node-version: ${{ steps.node.outputs.major }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: ${{ contains(needs.scope.outputs.cells, matrix.cell) }}
      # Eight suites guard on `existsSync` of tw5-core/ and dist/ — both gitignored build output.
      # Unbuilt, they SKIP and the job exits 0, so the run reads green while 35 tests never ran.
      # THE ENGINE BLOB IS A DELIBERATE RENDER, NEVER A BUILD SIDE EFFECT. tw5-core/ stays gitignored
      # because its sha256 IS the hearth's true name, so `build` refuses to render it and the bake reads
      # the blob that stands. A runner holds none until this step renders it from the submodule.
      - name: Render the TW5 core blob (suites guard on tw5-core/ and skip without it)
        if: ${{ contains(needs.scope.outputs.cells, matrix.cell) }}
        run: pnpm --filter @lararium/tw5 build:tw5-vendor
      # The root `build` stamps the source digest after `pnpm -r build`; an unstamped dist reads as
      # stale to every freshness gate and witness that compares against it.
      - name: Build (suites guard on built artifacts and silently skip without them)
        if: ${{ contains(needs.scope.outputs.cells, matrix.cell) }}
        run: pnpm build
      # THE HOLDER IS A DEPENDENCY, NOT AN OPTIONAL EXTRA. `content-palace` drives the python
      # mempalace holder live, and with no interpreter holding it the suite fails on an absent
      # dependency rather than on anything about the code. Skipping it instead would be worse:
      # absence-of-finding and absence-of-looking read identically in a green run.
      #
      # ONE VENV — `~/.venv`, the same path `spawn-resolve` probes and `lares vessel stand --init`
      # stands. A venv anywhere else is an interpreter with different powers, which is the whole
      # hazard that rule exists to close.
      #
      # ONE LIST. The suite's own dependencies live in `packages/lararium-sensorium/requirements.txt`,
      # which the root `requirements.txt` (the operator's ~/.venv manifest) includes. The root list's
      # prose-tier NLP stack stays out: it needs downloaded models and the router degrades through it.
      #
      # THE HOLDER INTERPRETER. A bare-runner cell stands the venv on setup-python's 3.12. A container cell stands it on
      # the image's own python3: the job container mounts the runner's hostedtoolcache, and setup-python's build there
      # links the runner image's OpenSSL, which the Playwright image's libraries do not carry, so its `ssl` cannot import
      # and pip cannot reach PyPI. The image's python3 carries ssl and no pip (Ubuntu splits ensurepip into python3-venv,
      # which uid 1001 cannot install), so the venv step bootstraps pip with get-pip.py.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ !matrix.container && contains(needs.scope.outputs.cells, matrix.cell) }}
        id: py
        with:
          python-version: '3.12'
      - name: Name the holder interpreter (it must carry ssl)
        if: ${{ contains(needs.scope.outputs.cells, matrix.cell) }}
        id: interp
        run: |
          python3 -c 'import ssl' || { echo "::error::$(command -v python3) carries no ssl module: the holder venv's pip cannot reach PyPI"; exit 1; }
          echo "python-version=$(python3 -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
      - id: mempalace-pin
        if: ${{ contains(needs.scope.outputs.cells, matrix.cell) }}
        run: echo "sha=$(git rev-parse HEAD:mempalace)" >> "$GITHUB_OUTPUT"

      # The key carries the exact interpreter PATCH: a restored venv's bin/python3 symlinks to the interpreter that built it
      # (the hostedtoolcache path of that patch, or the image's /usr/bin/python3), so under another patch it dangles (exit 127).
      - name: Cache the holder venv
        if: ${{ contains(needs.scope.outputs.cells, matrix.cell) }}
        id: venv-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.venv
          key: holder-venv-${{ runner.os }}-${{ matrix.container && 'pwimage' || 'host' }}-py${{ steps.interp.outputs.python-version }}-${{ steps.mempalace-pin.outputs.sha }}-${{ hashFiles('mempalace/pyproject.toml', 'packages/lararium-sensorium/requirements.txt') }}
      - name: Stand the holder venv (~/.venv)
        if: ${{ contains(needs.scope.outputs.cells, matrix.cell) }}
        env:
          CACHE_HIT: ${{ steps.venv-cache.outputs.cache-hit }}
        run: |
          # A restored venv whose interpreter does not answer, or answers without ssl, is no venv: stand it again (belt beside the patch-keyed cache).
          if [ "$CACHE_HIT" = 'true' ] && ~/.venv/bin/python3 -c 'import ssl' >/dev/null 2>&1; then exit 0; fi
          rm -rf ~/.venv
          if python3 -c 'import ensurepip' >/dev/null 2>&1; then
            python3 -m venv ~/.venv
            ~/.venv/bin/python3 -m pip install --upgrade pip
          else
            python3 -m venv --without-pip ~/.venv
            ~/.venv/bin/python3 -c "import sys, urllib.request; sys.stdout.buffer.write(urllib.request.urlopen('https://bootstrap.pypa.io/get-pip.py').read())" > "$RUNNER_TEMP/get-pip.py"
            ~/.venv/bin/python3 "$RUNNER_TEMP/get-pip.py"
          fi
          ~/.venv/bin/python3 -m pip install -e ./mempalace -r packages/lararium-sensorium/requirements.txt
      - name: Witness the holder answers
        if: ${{ contains(needs.scope.outputs.cells, matrix.cell) }}
        id: holder
        run: ~/.venv/bin/python3 -c "import mempalace; print('holder ok')"
      # `pnpm test` reaches the sensorium's two TypeScript tests only. The holder
      # suite (Python, beside its modules under scripts/) stands unhooked from CI
      # while the mempalace lane rests (operator, 2026-10-19); it re-hooks with
      # that lane through `~/.venv/bin/python3 -m pytest packages/lararium-sensorium/scripts`,
      # the venv that holds mempalace, never a bare `pytest`.
      # Keep the package verdict visible if the independent Python suite fails.
      # The holder gates package tests that exercise its real subprocess.
      - name: Find this cell's engines in the image (nothing installs)
        id: browser
        if: ${{ !cancelled() && steps.holder.outcome == 'success' && matrix.engines != '' }}
        timeout-minutes: 5
        env:
          ENGINES: ${{ matrix.engines }}
        run: |
          node -e '
            const p = require("playwright");
            for (const name of process.env.ENGINES.split(" ")) {
              const e = p[name].executablePath();
              require("node:fs").accessSync(e);
              console.log(name + ":", e);
            }
            console.log("playwright", require("playwright/package.json").version, "from", process.env.PLAYWRIGHT_BROWSERS_PATH);
          '
      # ONE SERIALIZATION INSIDE A CELL. The cell runs its packages one after another because packages share a
      # build tree and a rendezvous directory; running them in parallel measures a different repository than the
      # one an operator measures locally. Parallelism lives between cells, each with a tree of its own.
      - name: Run this cell's package suites
        if: ${{ !cancelled() && steps.holder.outcome == 'success' && (matrix.engines == '' || steps.browser.outcome == 'success') }}
        run: node tools/ci-cells.mjs run-test "${{ matrix.cell }}" --out "$RUNNER_TEMP/cell" --select "${{ needs.scope.outputs.packages }}"
      - name: Upload this cell's JSON reports (always, even on a red cell)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-cell-${{ matrix.cell }}
          path: ${{ runner.temp }}/cell/
          retention-days: 14
          # A cell that crashed before writing a report uploads nothing, and the gate names it missing.
          if-no-files-found: warn

  test:
    name: Test
    needs: [scope, test-cells]
    # Runs whatever the cells answered: a gate skipped by one red cell would read as nothing to report.
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork) && !(github.event_name == 'push' && (needs.scope.outputs.canon == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the Node floor (package.json engines.node)
        id: node
        # The floor major of package.json `engines.node`; setup-node would take the newest release of a `>=` range.
        run: echo "major=$(node -p "/\\d+/.exec(require('./package.json').engines.node)[0]")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.major }}
      - name: Download every cell's reports (one subdirectory per cell)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-cell-*
          path: artifacts
        continue-on-error: true
      - name: Gate — fails closed on any missing, empty, red or unexpected cell
        if: always()
        run: node tools/ci-cells.mjs verify-tests --artifacts-dir artifacts --select "${{ needs.scope.outputs.packages }}"
      - name: Gate — every cell job itself succeeded
        if: always()
        env:
          CELLS_RESULT: ${{ needs.test-cells.result }}
        run: |
          if [ "$CELLS_RESULT" != "success" ]; then
            echo "::error::the test cells ended $CELLS_RESULT, not success"
            exit 1
          fi

  # ─── witnesses (the whole fleet, under its own name) ───────────────────────
  # THE FLEET RODE INSIDE `test`, WHICH IS A PLACE IT CAN BE HIDDEN. `witness-all` exists because
  # chaining gates with `&&` lets the first red swallow every one after it; a step that runs AFTER
  # `pnpm test` in the same job inherits exactly that failure — one red suite and the whole fleet (34 `tools/*witness*.sh` files at this writing — the glob reads the live count)
  # witnesses never run, and the PR shows one red where there were two questions. Its own job asks
  # the fleet's question whatever the suites answer.
  #
  # WHAT THIS JOB CAN HONESTLY RUN: the witnesses `tools/*witness*.sh` globs (34 files at this writing — never a hand count) minus the
  # declared hold-outs. They need node, a pnpm install, python3 (domain-registry · exact-deps ·
  # meme-coordinates · mesh-coverage · mirror-parity · rendezvous-parity · rite-commands ·
  # surface-parity) and a BUILT tree — `frame-shape`, `surface-parity`, `rite-commands` and
  # `meme-check-hook` all read dist/ and refuse (or skip) without it.
  #
  # WHAT IT MUST SKIP, AND WHY: the five hold-outs `witness-all.sh` declares in HELD_OUT — civic ·
  # crossing · herm-mesh · mesh-scenarios stand docker-compose meshes this runner does not raise,
  # and browser-weld drives a real browser against a standing app. The script prints each one with
  # its reason under `── held out of this run ──`, so the skip is named IN THIS JOB'S LOG rather
  # than in a comment nobody reads; the step below fails if that roll call is missing, because a
  # skip that stops announcing itself is the silence these witnesses exist to break.
  #
  # THE JOB RUNS AS TWO CELLS (`WITNESS_CELLS` in tools/ci-cells.mjs): the heaviest witness apart, and the rest of the
  # fleet with the self-tests beside it. The job named `Witnesses` below is the gate over
  # them and fails closed on any missing, red or unexpected cell log.
  witness-cells:
    name: Witness cell ${{ matrix.cell }}
    needs: scope
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork) && !(github.event_name == 'push' && (needs.scope.outputs.canon == 'true' || needs.scope.outputs.witnesses == 'false')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: rest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # TiddlyWiki5 IS the vendored-core build input and mempalace IS the python import
          # root. Without them the tw5 build cannot run, so every downstream job fails on an
          # artifact the repo never had a chance to produce.
          submodules: recursive
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Read the Node floor (package.json engines.node)
        id: node
        # The floor major of package.json `engines.node`; setup-node would take the newest release of a `>=` range.
        run: echo "major=$(node -p "/\\d+/.exec(require('./package.json').engines.node)[0]")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.major }}
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      # Four witnesses read dist/ and one founds a vessel from the built CLI. Unbuilt they refuse or
      # skip, and a skip reads green — the exact shape this job exists to close.
      # call-reach · head-parity · sigil-parity read the engine blob; see the `test` job.
      - name: Render the TW5 core blob (three witnesses read it)
        run: pnpm --filter @lararium/tw5 build:tw5-vendor
      - name: Build (the fleet measures the built tree)
        id: build
        run: pnpm build
      # `ahu-pair-parity` reads the grammar wasm, which `pnpm build` never compiles: `*.wasm` stays
      # gitignored and the whole-tree build leaves it out. ONE COMMAND BUILDS IT EVERYWHERE — the
      # package's `build:wasm`, which `grammar-artifact` runs too and which strikes the wasm stamp the
      # witness's freshness door reads. The fleet runs whatever this answers, so a failed wasm build
      # reads as the witness naming the missing grammar rather than as a skipped fleet.
      - name: Build the grammar wasm (ahu-pair-parity reads it)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter ./packages/tree-sitter-memetic-wikitext build:wasm
      # The cell runs its witnesses through `witness-all`, which never short-circuits: the worst exit wins. The rest
      # cell's log must carry the held-out roll call, and the gate reads it there: a held-out witness that stops
      # naming itself has become an unmeasured gate wearing a green check. The self-tests are each
      # `tools/*.test.mjs`, planting the reds their tool owes against fakes and scratch trees, so they need no docker,
      # no browser and no standing app; the glob reads the live set, and each joins without a hand edit.
      # THE WALL TESTS RUN LIVE HERE. The broker's check and install seats and the launcher's PID-namespace containment all stand on
      # bubblewrap; Ubuntu 24.04 bars unprivileged user namespaces by default, so the step lifts that and PROVES the exact wall the
      # tests use. A failed proof stops the job before any test can skip over an unexercised wall, and on CI (CI=true) a missing
      # wall fails the wall tests by name instead of skipping them (tools/wall-test.mjs).
      - name: Install and prove bubblewrap user and PID namespaces
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-user --unshare-pid --ro-bind / / --proc /proc --dev /dev --tmpfs /tmp -- /usr/bin/true
      # THE KEEP'S SESSION PARITY (KS5) runs here: it reads bin/sync's own mirror half against the keep's port, byte for byte, and
      # needs rsync and zstd, which this bare runner installs (the cli-mesh cell's container cannot).
      - name: Prove the keep's session mirror byte-equal to bin/sync's (KS5)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.cell == 'rest' }}
        run: |
          sudo apt-get install --no-install-recommends -y rsync zstd
          cd packages/lares-cli && npx vitest run tests/keep-sessions.test.ts -t KS5
      - name: Run this cell
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tools/ci-cells.mjs run-witness "${{ matrix.cell }}" --out "$RUNNER_TEMP/cell"
      - name: Upload this cell's log (always, even on a red cell)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: witness-cell-${{ matrix.cell }}
          path: ${{ runner.temp }}/cell/
          retention-days: 14
          if-no-files-found: warn

  witnesses:
    name: Witnesses
    needs: [scope, quick, witness-cells]
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork) && !(github.event_name == 'push' && (needs.scope.outputs.canon == 'true' || needs.scope.outputs.witnesses == 'false')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the Node floor (package.json engines.node)
        id: node
        # The floor major of package.json `engines.node`; setup-node would take the newest release of a `>=` range.
        run: echo "major=$(node -p "/\\d+/.exec(require('./package.json').engines.node)[0]")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.major }}
      - name: Download every cell's log (one subdirectory per cell)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: witness-cell-*
          path: artifacts
        continue-on-error: true
      - name: Gate — fails closed on any missing, red or unexpected cell
        if: always()
        run: node tools/ci-cells.mjs verify-witnesses --artifacts-dir artifacts
      - name: Gate — the wall tests ran live (no bubblewrap skip in any cell log)
        if: always()
        run: |
          if grep -rl "no bubblewrap on this host" artifacts; then
            echo "::error::a wall test skipped for want of bubblewrap; the runner step must prove it"
            exit 1
          fi
      - name: Gate — every cell job itself succeeded
        if: always()
        env:
          CELLS_RESULT: ${{ needs.witness-cells.result }}
          QUICK_RESULT: ${{ needs.quick.result }}
        run: |
          if [ "$CELLS_RESULT" != "success" ]; then
            echo "::error::the witness cells ended $CELLS_RESULT, not success"
            exit 1
          fi
          if [ "$QUICK_RESULT" != "success" ]; then
            echo "::error::the quick job (it hosts the contract witness) ended $QUICK_RESULT, not success"
            exit 1
          fi

  # ─── e2e (every e2e set, sharded, behind one merge gate) ───────────────────────────────────
  # ONE E2E VERDICT, AND THE SHARDS GIVE IT. Every e2e set rides the shard matrix of `e2e-shards.yml`
  # (the table `E2E_SETS` in tools/e2e-shards.mjs) and ends on its merge gate, which fails closed on a
  # missing, empty, red or mismatched shard. This job CALLS that workflow, so a push to a branch and a
  # lane push to `ci/<lane>` run the same matrix under the same gate, and the workflow file holds the
  # one statement of it.
  #
  # A single runner walking the whole set one file at a time outgrew its own 45-minute ceiling and timed
  # out; a job that cannot finish reports nothing about the code. MEASURED on the shard lane (run
  # 38409777858): five shard runners at 15 + 11 + 10 + 10 + 2 minutes and a one-minute merge, about 48
  # runner-minutes and 16 minutes of wall clock, against 45 runner-minutes spent on no verdict.
  #
  # The called jobs read on the run as `E2E / Shard <set> <k>/<n>` and `E2E / Merge shard reports`.
  e2e:
    name: E2E
    # `!cancelled()` keeps the required `E2E / Merge shard reports` standing when the scope read itself fails: the doorstep
    # input then reads code, and the shards answer (a lane still answers on its doorstep).
    needs: scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork) }}
    uses: ./.github/workflows/e2e-shards.yml
    with:
      doorstep: ${{ (github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/develop--') || startsWith(github.ref, 'refs/heads/lane/') || needs.scope.outputs.canon == 'true')) }}


name: CI

# Golden-principle gates for the Lararium monorepo, mapped to the project's
# domains + models (web3 local-first · causal-islands · the meme graph).
#
# A FULL RUN RAISES AT MOST TEN JOBS AT ONCE (tools/ci-graph.test.mjs reads this file and the called e2e workflow), so a
# second full run starts beside it inside the account's twenty running jobs:
#   quick           — build + generated-artifact freshness (the checked-in plugin artifacts — the lar:// canonical copy AND
#                     the `$:/` standalone distribution — must match a fresh build), typecheck, the exact-deps witness, the
#                     boot budget (the cache-stable boot stays under its char ceiling), the grammar artifact gates, the
#                     browser floor crossing, pristine upstream (the meme routes AND a stock single-file build meet a
#                     PUBLISHED tiddlywiki, against the COMMITTED standalone artifact), then the contract witness cell
#   test            — every package's suite as four cells (node dealt across two by file weight), incl. the meme
#                     round-trip laws and the two plugin-artifact parity gates (lar:// + the standalone `$:/` distribution)
#   witnesses       — the whole `tools/*witness*.sh` fleet through `witness-all`, under its own name so a red suite cannot
#                     swallow it; the docker/browser hold-outs are named with their reasons in the job's log; beside it,
#                     every `tools/*.test.mjs` self-test the instruments carry
#   e2e             — every e2e set through the real CLI + vessels, sharded: this workflow calls `e2e-shards.yml` and takes
#                     its merge gate's verdict
#
# ONE RUN PER SHA. A push to a branch and a pull request from the same repository name one sha, so the push owns it and
# every job stands guarded off on the same-repository `pull_request` event; a fork's pull request has no push here and runs
# whole. `merge_group` is the hook for a native merge queue: no job guards it off, so the queue's merge-ref run raises the
# same ten jobs.
# Defense-in-depth, not a single flag: build-freshness (CI, authoritative) is
# backed by the always-on plugin-artifact-parity unit test in `test` (local-first,
# runs in every `pnpm test`). Dropping one gate does not open the hole.

on:
  push:
    # `branches` and `branches-ignore` cannot both sit under the same `push:` event (GitHub
    # workflow syntax), so this replaces the blanket `branches: ["**"]` rather than sitting beside
    # it — the two names mean the same "every branch" before the exclusion.
    #
    # A lane push to `ci/<lane>` is e2e-shards.yml's own single-fire trigger (tools/e2e-shards.mjs
    # pushes it and watches that ONE run). Without this exclusion the same push would also raise the
    # whole full-CI matrix here — two answers to one push, and the shard lane's point (a cheap,
    # throwaway proof run) would cost a full CI run every time.
    branches-ignore: ["ci/**"]
    # Meme, docs and wiki paths raise no run on a push (tools/ci-ignored-paths.json; a test pins these globs equal
    # to it). A push that changes only these leaves the in-flight run alone. pull_request stays un-ignored.
    paths-ignore:
      - "bags/**/*.mem"
      - "**/*.md"
      - "wikis/**"
      - "CHANGELOG.md"
  pull_request:
    branches: [main]
  # The hook for a native merge queue: the queue raises this event on its merge ref, and no job guards it off.
  merge_group:
  # A controller runs CI by hand on a lane head whose own push the ignore list skipped: a meme-only head never
  # raises a run of its own, and the land guard reads a head's verdict, not its ancestor's alone.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  # ONE pnpm, exact: the same string as package.json `packageManager` and the Dockerfile. A lock
  # written by any other pnpm rewrites its peer suffixes on its next write.
  PNPM_VERSION: "11.28.5"
  # The published tiddlywiki the plugin proves it drops into (the `pristine-upstream` job). ONE
  # version, one place: the job's name, its cache key, its pack and its log-line check all read it.
  TW5_PRISTINE: "5.4.1"

jobs:
  # ─── quick (six small gates and the contract witness, ONE runner) ─────────────────────────
  # THE ACCOUNT RUNS ABOUT TWENTY JOBS AT ONCE, and a full run raises at most TEN (tools/ci-graph.test.mjs holds this file to
  # it), so a second full run starts beside the first. The six small gates that each held a runner of their own (build +
  # freshness 1 min, typecheck 1, pristine upstream 1.4, boot budget 0.5, grammar artifact gates 1.1, floor crossing 2.7: run
  # 41280151942) now share ONE checkout, install and build, and the contract witness rides behind them. Every step keeps its
  # own name and runs whatever the steps before it answered (`!cancelled()`), so one red gate never hides another and the job
  # reads red by step name. The contract witness uploads `witness-cell-contract-witness` as its own cell, so the Witnesses
  # gate keys on that name wherever the cell runs.
  quick:
    name: Quick gates
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # TiddlyWiki5 IS the vendored-core build input and mempalace IS the python import
          # root. Without them the tw5 build cannot run, so every downstream job fails on an
          # artifact the repo never had a chance to produce.
          submodules: recursive
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # THE NODE FLOOR, NAMED. A plain TW5 server evaluates modules in a sandbox carrying none of
      # TextEncoder/TextDecoder/crypto; `host-globals-lend.ts` lends the host's own copies through
      # `process.getBuiltinModule` (Node >=24) and silently no-ops without it. Absent, the meme laws' hashing dies
      # deep inside the contact as a bare "TextEncoder is not defined"; this step names the real floor first.
      - name: Node floor — process.getBuiltinModule must be present
        run: |
          node -e '
            if (typeof process.getBuiltinModule !== "function") {
              console.error("::error::Node " + process.version + " lacks process.getBuiltinModule — the plugin cannot lend TextEncoder/TextDecoder/crypto into the stock TW5 sandbox (host-globals-lend.ts). Pin Node >=24 (root package.json engines); below that floor the hashing paths fail deep in the contact as a bare \"TextEncoder is not defined\".");
              process.exit(1);
            }
            console.log("process.getBuiltinModule present on " + process.version);
          '
      - run: pnpm install --frozen-lockfile
      # `@lararium/mesh` publishes its subpaths into a GITIGNORED dist/, so `tsc` resolves none of them on an unbuilt tree.
      # THE ENGINE BLOB IS A DELIBERATE RENDER, NEVER A BUILD SIDE EFFECT: tw5-core/ stays gitignored because its sha256 IS the
      # hearth's true name, so `build` refuses to render it. The root `build` stamps the source digest after `pnpm -r build`.
      - name: Render the TW5 core blob
        run: pnpm --filter @lararium/tw5 build:tw5-vendor
      - name: Build all packages
        id: build
        run: pnpm build
      # A range in a manifest is a version nobody chose. This costs no build.
      - name: Every dependency names ONE version
        if: ${{ !cancelled() }}
        run: tools/exact-deps-witness.sh
      - name: Generated artifacts must be fresh (build emits no tracked diff)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          if ! git diff --quiet; then
            echo "::error::A fresh build changed tracked files — committed generated artifacts are stale."
            echo "Regenerate and commit them: pnpm --filter @lararium/tw5 build"
            git --no-pager diff --stat
            git --no-pager diff
            exit 1
          fi
          echo "Generated artifacts are fresh."
      - name: Typecheck all packages
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm -r typecheck
      - name: noosphere-boot.mem must stay under the 40000-char ceiling
        if: ${{ !cancelled() }}
        run: |
          # The single quotes hold a node program whole: its backticks are JavaScript, never the shell's.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const p = "bags/lares/ha.ka.ba/lares/api/noosphere-boot.mem";
            // A MISSING SEED IS ITS OWN FAULT, NEVER A BUDGET ONE.
            if (!fs.existsSync(p)) {
              console.error("::error::" + p + " does not exist — the budget gate cannot measure a seed it cannot find.");
              process.exit(1);
            }
            // CODE POINTS, never bytes: the seed carries sigils, Hawaiian and Devanagari.
            const n = [...fs.readFileSync(p, "utf8")].length;
            console.log("boot code points:", n, "/ 40000");
            if (n >= 40000) {
              console.error("::error::" + p + " is " + n + " chars — over the cache-stable boot budget (40000). Reclaim before editing.");
              process.exit(1);
            }
          '
      # ── grammar artifact (ship step 0: the quad-pinned carrier stays truth) ──
      # The py host's three imports, each at the version the house venv runs, so this gate measures the same runtime the operator does.
      - name: Install py host deps
        if: ${{ !cancelled() }}
        run: pip install tree-sitter==0.26.0 pytest==9.1.1 pygls==2.1.1
      - name: generate-parity — the committed parser.c stays the truth
        if: ${{ !cancelled() }}
        working-directory: packages/tree-sitter-memetic-wikitext
        run: pnpm run gate:generate-parity
      - name: fold + golden manifest gates (py host)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: packages/tree-sitter-memetic-wikitext
        run: pnpm run gate:fold
      # THE TS HOST LOADS THE WASM, SO THE WASM BUILDS FIRST. `*.wasm` is gitignored; a runner holds none until `build:wasm`
      # emits it. The contract witness below needs the same wasm and the stamp this strikes.
      - name: wasm builds under the pinned CLI
        id: wasm
        if: ${{ !cancelled() }}
        working-directory: packages/tree-sitter-memetic-wikitext
        run: pnpm run build:wasm
      - name: fold + parity gates (ts host)
        if: ${{ !cancelled() && steps.wasm.outcome == 'success' }}
        working-directory: packages/tree-sitter-memetic-wikitext
        run: pnpm run gate:fold-ts
      # ── the browser engines: one Chromium for the floor crossing and the pristine suites ──
      - name: Name the Playwright version (the engine cache key)
        id: pw-version
        if: ${{ !cancelled() }}
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      # The engine directory restores by the pinned Playwright version; a bump re-downloads. The install below
      # still runs apt for the system libraries, so it carries its own timeout and a stall there fails fast.
      - name: Cache the Playwright engines (chromium)
        if: ${{ !cancelled() }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}-chromium
      - name: Install the Chromium engine
        id: chromium
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium
      # ── the browser floor crossing (W23) ──
      # A real Chromium on the page a staged hearth serves, crossing that hearth's gates
      # (`packages/lararium-web/tests/e2e/floor-crossing.e2e.test.ts`). It rides its own config
      # (`vitest.crossing.config.ts`) and no package suite collects it. A scratch HOME, LAR_ROOT and LAR_STAGE_DIR keep the
      # staged vessels off any real home; Playwright's engine cache stays where the install put it.
      - name: Run the floor crossing under a scratch home
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: |
          scratch="$RUNNER_TEMP/crossing"
          mkdir -p "$scratch/home" "$scratch/root" "$scratch/stage"
          cd packages/lararium-web
          env PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright" HOME="$scratch/home" LAR_ROOT="$scratch/root" LAR_STAGE_DIR="$scratch/stage" \
            npx vitest run --config vitest.crossing.config.ts
      # ── pristine upstream (the plugin drops into a PUBLISHED tiddlywiki) ──
      # THE INSTRUMENT AND ITS INVOKER. `meme-routes.e2e` takes `LARES_TW5_JS` and runs the whole contact against any
      # `tiddlywiki.js`; the package suites run it against the FORK. THE SUITE SKIPS LOUDLY WHEN ITS ENGINE IS MISSING, AND A
      # SKIP READS GREEN, so the step greps the contact line for the pinned version.
      # THE COMMITTED ARTIFACT, NOT A FRESH REBUILD: the pristine engine meets the TRACKED `$:/` distribution. This block runs
      # after the freshness gate, which already proved a fresh build and the tracked copy agree.
      - name: Stamp the dependency build for the pristine suites
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tools/stamp-build.mjs .
      - name: Point dist-plugin at the committed standalone artifact
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cp packages/lararium-tw5/plugins/standalone/lares-memetic-wikitext.tid packages/lararium-tw5/dist-plugin/lares-memetic-wikitext.tid
      # ONE VERSION, ONE PLACE. The tarball caches by the pinned version; a bump re-packs.
      - name: Cache the published tiddlywiki
        id: pristine-cache
        if: ${{ !cancelled() }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lares-pristine/tiddlywiki-${{ env.TW5_PRISTINE }}
          key: pristine-tiddlywiki-${{ env.TW5_PRISTINE }}
      - name: Pack tiddlywiki@${{ env.TW5_PRISTINE }} from npm
        if: ${{ !cancelled() && steps.pristine-cache.outputs.cache-hit != 'true' }}
        run: |
          dir=~/.cache/lares-pristine/tiddlywiki-$TW5_PRISTINE
          mkdir -p "$dir" && cd "$dir"
          npm pack "tiddlywiki@$TW5_PRISTINE" --silent
          tar xzf "tiddlywiki-$TW5_PRISTINE.tgz"
      - name: Witness the engine is the one pinned
        if: ${{ !cancelled() }}
        run: |
          pkg=~/.cache/lares-pristine/tiddlywiki-$TW5_PRISTINE/package
          test -f "$pkg/tiddlywiki.js"
          node -e 'const v=require(process.argv[1]+"/package.json").version; console.log("pristine engine: tiddlywiki@"+v); if(v!==process.env.TW5_PRISTINE){console.error("::error::packed "+v+", pinned "+process.env.TW5_PRISTINE);process.exit(1)}' "$pkg"
      - name: meme-routes + standalone single-file contact against the pristine engine
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: |
          export LARES_TW5_JS=~/.cache/lares-pristine/tiddlywiki-$TW5_PRISTINE/package/tiddlywiki.js
          export LARES_E2E_TMP="$RUNNER_TEMP/pristine-e2e"
          pnpm --filter @lararium/tw5 exec vitest run tests/meme-routes.e2e.test.ts tests/standalone-single-file.e2e.test.ts 2>&1 | tee "$RUNNER_TEMP/pristine.log"
          test "${PIPESTATUS[0]}" -eq 0
      - name: The log names the engine it met
        if: ${{ !cancelled() }}
        run: |
          line=$(grep -a "meme-routes.e2e: contact with TiddlyWiki" "$RUNNER_TEMP/pristine.log" || true)
          echo "$line"
          if ! grep -aq "contact with TiddlyWiki $TW5_PRISTINE " "$RUNNER_TEMP/pristine.log"; then
            echo "::error::the contact never named tiddlywiki@$TW5_PRISTINE — the suite skipped or met another engine"
            exit 1
          fi
      # ── the contract witness (the hosted witness cell `contract-witness`; WITNESS_CELLS in tools/ci-cells.mjs) ──
      - name: Run the hosted witness cell contract-witness
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.wasm.outcome == 'success' }}
        run: node tools/ci-cells.mjs run-witness contract-witness --out "$RUNNER_TEMP/cell"
      - name: Upload the hosted cell's log (always, even on a red cell)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: witness-cell-contract-witness
          path: ${{ runner.temp }}/cell/
          retention-days: 14
          if-no-files-found: warn

  # ─── test (all package suites, as cells) ───────────────────────────────────
  # EACH CELL IS A SLICE OF THE SUITES ON A RUNNER OF ITS OWN, and the slowest cell sets the wall clock. The slices are
  # the table `TEST_CELLS` in tools/ci-cells.mjs: node dealt across two cells by file weight (vitest's own shard measured worse; see TEST_CELLS), the other
  # packages grouped into two cells by weight. FEW CELLS: every cell repeats checkout, install and build, and the lanes share one capped
  # runner pool, so total job-minutes decides, with each run's critical path held near the slowest e2e shard. Every cell is self-contained (its own checkout, install, build, holder venv and engines) and uploads
  # one JSON report per package; the reports double as the per-file timings that name the slowest files. The job
  # named `Test` below is the gate: it fails closed on any missing, empty, red or unexpected cell.
  test-cells:
    name: Test cell ${{ matrix.cell }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # A red cell must never cancel its siblings: the gate needs every cell's answer to tell one red
      # from one that never got to answer.
      fail-fast: false
      matrix:
        include:
          - cell: node-a
          - cell: node-b
          - cell: web-tw5
          - cell: cli-mesh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `doctype-render-parity` proves a property of one past sweep by reading its two fixed
          # forms from committed fixtures (`fixtures/doctype-render-parity/`), never from history —
          # a depth-1 checkout runs it the same as a whole one. No other suite or witness reads git
          # history, so the default shallow checkout stands.
          # TiddlyWiki5 IS the vendored-core build input and mempalace IS the python import
          # root. Without them the tw5 build cannot run, so every downstream job fails on an
          # artifact the repo never had a chance to produce.
          submodules: recursive
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Eight suites guard on `existsSync` of tw5-core/ and dist/ — both gitignored build output.
      # Unbuilt, they SKIP and the job exits 0, so the run reads green while 35 tests never ran.
      # THE ENGINE BLOB IS A DELIBERATE RENDER, NEVER A BUILD SIDE EFFECT. tw5-core/ stays gitignored
      # because its sha256 IS the hearth's true name, so `build` refuses to render it and the bake reads
      # the blob that stands. A runner holds none until this step renders it from the submodule.
      - name: Render the TW5 core blob (suites guard on tw5-core/ and skip without it)
        run: pnpm --filter @lararium/tw5 build:tw5-vendor
      # The root `build` stamps the source digest after `pnpm -r build`; an unstamped dist reads as
      # stale to every freshness gate and witness that compares against it.
      - name: Build (suites guard on built artifacts and silently skip without them)
        run: pnpm build
      # THE HOLDER IS A DEPENDENCY, NOT AN OPTIONAL EXTRA. `content-palace` drives the python
      # mempalace holder live, and with no interpreter holding it the suite fails on an absent
      # dependency rather than on anything about the code. Skipping it instead would be worse:
      # absence-of-finding and absence-of-looking read identically in a green run.
      #
      # ONE VENV — `~/.venv`, the same path `spawn-resolve` probes and `lares vessel stand --init`
      # stands. A venv anywhere else is an interpreter with different powers, which is the whole
      # hazard that rule exists to close.
      #
      # ONE LIST. The suite's own dependencies live in `packages/lararium-sensorium/requirements.txt`,
      # which the root `requirements.txt` (the operator's ~/.venv manifest) includes. The root list's
      # prose-tier NLP stack stays out: it needs downloaded models and the router degrades through it.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Cache the holder venv
        id: venv-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.venv
          key: holder-venv-${{ runner.os }}-py312-${{ hashFiles('mempalace/pyproject.toml', 'packages/lararium-sensorium/requirements.txt') }}
      - name: Stand the holder venv (~/.venv)
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv ~/.venv
          ~/.venv/bin/python3 -m pip install --upgrade pip
          ~/.venv/bin/python3 -m pip install -e ./mempalace -r packages/lararium-sensorium/requirements.txt
      - name: Witness the holder answers
        id: holder
        run: ~/.venv/bin/python3 -c "import mempalace; print('holder ok')"
      # `pnpm test` reaches the sensorium's two TypeScript tests only. The holder
      # suite (Python, beside its modules under scripts/) stands unhooked from CI
      # while the mempalace lane rests (operator, 2026-10-19); it re-hooks with
      # that lane through `~/.venv/bin/python3 -m pytest packages/lararium-sensorium/scripts`,
      # the venv that holds mempalace, never a bare `pytest`.
      # Keep the package verdict visible if the independent Python suite fails.
      # The holder gates package tests that exercise its real subprocess.
      - name: Name the Playwright version (the engine cache key)
        if: ${{ !cancelled() && steps.holder.outcome == 'success' }}
        id: pw-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      # The engine directory restores by the pinned Playwright version; a bump re-downloads. The install below
      # still runs apt for the system libraries, so it carries its own timeout and a stall there fails fast.
      - name: Cache the Playwright engines (chromium firefox webkit)
        if: ${{ !cancelled() && steps.holder.outcome == 'success' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}-chromium-firefox-webkit
      - name: Install Playwright engines (browser-vessel suite, three engines)
        if: ${{ !cancelled() && steps.holder.outcome == 'success' }}
        id: browser
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      # ONE SERIALIZATION INSIDE A CELL. The cell runs its packages one after another because packages share a
      # build tree and a rendezvous directory; running them in parallel measures a different repository than the
      # one an operator measures locally. Parallelism lives between cells, each with a tree of its own.
      - name: Run this cell's package suites
        if: ${{ !cancelled() && steps.holder.outcome == 'success' && steps.browser.outcome == 'success' }}
        run: node tools/ci-cells.mjs run-test "${{ matrix.cell }}" --out "$RUNNER_TEMP/cell"
      - name: Upload this cell's JSON reports (always, even on a red cell)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-cell-${{ matrix.cell }}
          path: ${{ runner.temp }}/cell/
          retention-days: 14
          # A cell that crashed before writing a report uploads nothing, and the gate names it missing.
          if-no-files-found: warn

  test:
    name: Test
    needs: test-cells
    # Runs whatever the cells answered: a gate skipped by one red cell would read as nothing to report.
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download every cell's reports (one subdirectory per cell)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-cell-*
          path: artifacts
        continue-on-error: true
      - name: Gate — fails closed on any missing, empty, red or unexpected cell
        if: always()
        run: node tools/ci-cells.mjs verify-tests --artifacts-dir artifacts
      - name: Gate — every cell job itself succeeded
        if: always()
        env:
          CELLS_RESULT: ${{ needs.test-cells.result }}
        run: |
          if [ "$CELLS_RESULT" != "success" ]; then
            echo "::error::the test cells ended $CELLS_RESULT, not success"
            exit 1
          fi

  # ─── witnesses (the whole fleet, under its own name) ───────────────────────
  # THE FLEET RODE INSIDE `test`, WHICH IS A PLACE IT CAN BE HIDDEN. `witness-all` exists because
  # chaining gates with `&&` lets the first red swallow every one after it; a step that runs AFTER
  # `pnpm test` in the same job inherits exactly that failure — one red suite and the whole fleet (34 `tools/*witness*.sh` files at this writing — the glob reads the live count)
  # witnesses never run, and the PR shows one red where there were two questions. Its own job asks
  # the fleet's question whatever the suites answer.
  #
  # WHAT THIS JOB CAN HONESTLY RUN: the witnesses `tools/*witness*.sh` globs (34 files at this writing — never a hand count) minus the
  # declared hold-outs. They need node, a pnpm install, python3 (domain-registry · exact-deps ·
  # meme-coordinates · mesh-coverage · mirror-parity · rendezvous-parity · rite-commands ·
  # surface-parity) and a BUILT tree — `frame-shape`, `surface-parity`, `rite-commands` and
  # `meme-check-hook` all read dist/ and refuse (or skip) without it.
  #
  # WHAT IT MUST SKIP, AND WHY: the five hold-outs `witness-all.sh` declares in HELD_OUT — civic ·
  # crossing · herm-mesh · mesh-scenarios stand docker-compose meshes this runner does not raise,
  # and browser-weld drives a real browser against a standing app. The script prints each one with
  # its reason under `── held out of this run ──`, so the skip is named IN THIS JOB'S LOG rather
  # than in a comment nobody reads; the step below fails if that roll call is missing, because a
  # skip that stops announcing itself is the silence these witnesses exist to break.
  #
  # THE JOB RUNS AS TWO CELLS (`WITNESS_CELLS` in tools/ci-cells.mjs): the heaviest witness apart, and the rest of the
  # fleet with the self-tests beside it. The job named `Witnesses` below is the gate over
  # them and fails closed on any missing, red or unexpected cell log.
  witness-cells:
    name: Witness cell ${{ matrix.cell }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: rest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # TiddlyWiki5 IS the vendored-core build input and mempalace IS the python import
          # root. Without them the tw5 build cannot run, so every downstream job fails on an
          # artifact the repo never had a chance to produce.
          submodules: recursive
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      # Four witnesses read dist/ and one founds a vessel from the built CLI. Unbuilt they refuse or
      # skip, and a skip reads green — the exact shape this job exists to close.
      # call-reach · head-parity · sigil-parity · turn-parity read the engine blob; see the `test` job.
      - name: Render the TW5 core blob (four witnesses read it)
        run: pnpm --filter @lararium/tw5 build:tw5-vendor
      - name: Build (the fleet measures the built tree)
        id: build
        run: pnpm build
      # `ahu-pair-parity` reads the grammar wasm, which `pnpm build` never compiles: `*.wasm` stays
      # gitignored and the whole-tree build leaves it out. ONE COMMAND BUILDS IT EVERYWHERE — the
      # package's `build:wasm`, which `grammar-artifact` runs too and which strikes the wasm stamp the
      # witness's freshness door reads. The fleet runs whatever this answers, so a failed wasm build
      # reads as the witness naming the missing grammar rather than as a skipped fleet.
      - name: Build the grammar wasm (ahu-pair-parity reads it)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter ./packages/tree-sitter-memetic-wikitext build:wasm
      # The cell runs its witnesses through `witness-all`, which never short-circuits: the worst exit wins. The rest
      # cell's log must carry the held-out roll call, and the gate reads it there: a held-out witness that stops
      # naming itself has become an unmeasured gate wearing a green check. The self-tests are each
      # `tools/*.test.mjs`, planting the reds their tool owes against fakes and scratch trees, so they need no docker,
      # no browser and no standing app; the glob reads the live set, and each joins without a hand edit.
      - name: Run this cell
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tools/ci-cells.mjs run-witness "${{ matrix.cell }}" --out "$RUNNER_TEMP/cell"
      - name: Upload this cell's log (always, even on a red cell)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: witness-cell-${{ matrix.cell }}
          path: ${{ runner.temp }}/cell/
          retention-days: 14
          if-no-files-found: warn

  witnesses:
    name: Witnesses
    needs: [quick, witness-cells]
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download every cell's log (one subdirectory per cell)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: witness-cell-*
          path: artifacts
        continue-on-error: true
      - name: Gate — fails closed on any missing, red or unexpected cell
        if: always()
        run: node tools/ci-cells.mjs verify-witnesses --artifacts-dir artifacts
      - name: Gate — every cell job itself succeeded
        if: always()
        env:
          CELLS_RESULT: ${{ needs.witness-cells.result }}
          QUICK_RESULT: ${{ needs.quick.result }}
        run: |
          if [ "$CELLS_RESULT" != "success" ]; then
            echo "::error::the witness cells ended $CELLS_RESULT, not success"
            exit 1
          fi
          if [ "$QUICK_RESULT" != "success" ]; then
            echo "::error::the quick job (it hosts the contract witness) ended $QUICK_RESULT, not success"
            exit 1
          fi

  # ─── e2e (every e2e set, sharded, behind one merge gate) ───────────────────────────────────
  # ONE E2E VERDICT, AND THE SHARDS GIVE IT. Every e2e set rides the shard matrix of `e2e-shards.yml`
  # (the table `E2E_SETS` in tools/e2e-shards.mjs) and ends on its merge gate, which fails closed on a
  # missing, empty, red or mismatched shard. This job CALLS that workflow, so a push to a branch and a
  # lane push to `ci/<lane>` run the same matrix under the same gate, and the workflow file holds the
  # one statement of it.
  #
  # A single runner walking the whole set one file at a time outgrew its own 45-minute ceiling and timed
  # out; a job that cannot finish reports nothing about the code. MEASURED on the shard lane (run
  # 38409777858): five shard runners at 15 + 11 + 10 + 10 + 2 minutes and a one-minute merge, about 48
  # runner-minutes and 16 minutes of wall clock, against 45 runner-minutes spent on no verdict.
  #
  # The called jobs read on the run as `E2E / Shard <set> <k>/<n>` and `E2E / Merge shard reports`.
  e2e:
    name: E2E
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork }}
    uses: ./.github/workflows/e2e-shards.yml


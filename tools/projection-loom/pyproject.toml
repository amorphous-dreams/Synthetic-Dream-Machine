[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "projection-loom"
version = "2.1.0"
description = "Constructive CAD, negative-space growth, relational emergence and fixed evidence"
requires-python = ">=3.12"
dependencies = ["cadquery>=2.4", "numpy>=1.26", "scipy>=1.11", "networkx>=3", "opencv-python-headless>=4.8", "Pillow>=10", "trimesh>=4"]
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
projection-loom = "projection_loom.cli:main"
[tool.setuptools.packages.find]
include = ["projection_loom*"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "projection-loom"
version = "2.2.0"
description = "Evidence-first constructive CAD, relational grammar, staged epochs and fixed witnesses"
requires-python = ">=3.12"
dependencies = ["cadquery>=2.4", "numpy>=1.26", "scipy>=1.11", "networkx>=3", "opencv-python-headless>=4.8", "Pillow>=10", "trimesh>=4"]
[project.optional-dependencies]
geo = ["rasterio>=1.3", "pyproj>=3.6"]
test = ["pytest>=8", "rasterio>=1.3", "pyproj>=3.6"]
[project.scripts]
projection-loom = "projection_loom.cli:main"
[tool.setuptools.packages.find]
include = ["projection_loom*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full native CAD, compound rendering and OODA-HA integration"]

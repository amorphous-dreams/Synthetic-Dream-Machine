events {}

http {
  # Docker's embedded DNS resolves the internal peer when the live request
  # arrives. This keeps startup independent of container ordering.
  resolver 127.0.0.11 ipv6=off valid=5s;
  large_client_header_buffers 4 16k;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The prepared public projection owns only these finite paths. There is no
    # generic root fallback and no private-data mount in this container.
    location = / {
      try_files /index.html =404;
      add_header Cache-Control "no-store" always;
    }

    location = /assets/app.js {
      try_files /assets/app.js =404;
      add_header Cache-Control "public, immutable, max-age=31536000" always;
    }

    location = /assets/worker.js {
      try_files /assets/worker.js =404;
      add_header Cache-Control "public, immutable, max-age=31536000" always;
    }

    # Optional phone/PWA install projection. The page can boot without it;
    # when emitted, its finite route remains explicit and never falls through.
    location = /manifest.webmanifest {
      try_files /manifest.webmanifest =404;
      add_header Cache-Control "no-store" always;
      default_type application/manifest+json;
    }

    location = /genesis/seed.json {
      try_files /genesis/seed.json =404;
      add_header Cache-Control "no-store" always;
    }

    location ~ "^/genesis/cas/[0-9a-f]{64}$" {
      try_files $uri =404;
      add_header Cache-Control "public, immutable, max-age=31536000" always;
      default_type application/octet-stream;
    }

    # A gate's knock line runs long: the sealed gate's first flight rides
    # Sec-WebSocket-Protocol, so the request side admits a 16k header line.
    # https://nginx.org/en/docs/http/ngx_http_core_module.html#large_client_header_buffers

    # Only the live socket routes reach the internal peer, each on its knocked
    # path: a gate answers an upgrade only at `<route>/<knock>` (the sync route
    # `/ws`, the flow's floor route `/flow`), so each route forwards as a
    # PREFIX and bare `/ws` falls to the refusal below. Explicit upgrade
    # forwarding proves carrier transport without giving NGINX peer authority.
    # The gate's server pings every socket each 30 s (GATE_SERVER_HEARTBEAT_MS
    # in face-gate-server.ts), so an idle session never reaches the 90 s read
    # bound while its peer answers.
    location ^~ /ws/ {
      set $lararium_peer http://upstream:4321;
      proxy_pass $lararium_peer;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_buffer_size 16k;
      proxy_buffers 8 16k;
      proxy_read_timeout 90s;
      proxy_send_timeout 90s;
    }

    location ^~ /flow/ {
      set $lararium_peer http://upstream:4321;
      proxy_pass $lararium_peer;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_buffer_size 16k;
      proxy_buffers 8 16k;
      proxy_read_timeout 90s;
      proxy_send_timeout 90s;
    }

    # Refuse every unlisted path; in particular, never turn a missing/private
    # request into index.html and never forward it to the peer.
    location / {
      return 404;
    }
  }
}

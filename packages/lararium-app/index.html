<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lararium — browser vessel</title>
    <!-- THE PHONE SEAT (basket-one #/the-phone-seat): the manifest lets a phone set this vessel into its own
         house — a Home Screen install, which exempts the origin from WebKit's seven-day clock. The page never
         demands it; `phone-seat.ts` explains and offers, once, where the clock stands. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lararium" />
    <meta name="theme-color" content="#0d0f14" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        font: 15px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        background: #0d0f14;
        color: #c9d1d9;
      }
      main { max-width: 760px; margin: 6vh auto; padding: 0 1.25rem; }
      h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: -0.01em; }
      h1 .glyph { opacity: 0.85; }
      .sub { color: #768390; margin-top: -0.4rem; }
      .panel {
        margin-top: 1.5rem; border: 1px solid #21262d; border-radius: 10px;
        background: #11151c; overflow: hidden;
      }
      .panel h2 {
        margin: 0; padding: 0.6rem 1rem; font-size: 0.78rem; text-transform: uppercase;
        letter-spacing: 0.08em; color: #768390; border-bottom: 1px solid #21262d; background: #0f1319;
      }
      .rows { padding: 0.5rem 1rem 0.9rem; }
      .row { display: flex; gap: 0.75rem; padding: 0.15rem 0; }
      .row .k { color: #768390; min-width: 9rem; }
      .row .v { color: #c9d1d9; word-break: break-all; }
      #phases .phase { padding: 0.12rem 0; color: #58a6ff; }
      #phases .phase::before { content: "→ "; color: #3fb950; }
      .ok { color: #3fb950; } .warn { color: #d29922; } .err { color: #f85149; }
      .veil { color: #d2a8ff; }

      /* The admit surface carries a THUMB. Every tap target clears 44px, the paste box holds 16px type
         (below that, mobile Safari zooms the page on focus), and the rows stack once the viewport
         narrows past a phone's width. The page states this vessel's own key, because this vessel is the
         only place that key exists — the operator cannot admit a stranger it cannot name. */
      .copyrow { display: flex; gap: 0.5rem; align-items: stretch; padding: 0.3rem 0; flex-wrap: wrap; }
      .copyrow .val {
        flex: 1 1 14rem; min-width: 0; padding: 0.55rem 0.7rem; border-radius: 8px;
        border: 1px solid #21262d; background: #0d1117; color: #c9d1d9;
        font: inherit; font-size: 0.92rem; word-break: break-all; user-select: all; -webkit-user-select: all;
      }
      button {
        min-height: 44px; padding: 0 0.9rem; border-radius: 8px; border: 1px solid #30363d;
        background: #1b2029; color: #c9d1d9; font: inherit; font-size: 0.9rem; cursor: pointer;
      }
      button:hover:not(:disabled) { background: #232a35; }
      button:disabled { opacity: 0.45; cursor: default; }
      .admit { padding: 0.2rem 1rem 1rem; }
      .admit label { display: block; color: #768390; font-size: 0.82rem; padding: 0.5rem 0 0.35rem; }
      #admit-paste {
        width: 100%; box-sizing: border-box; min-height: 5.5rem; resize: vertical;
        padding: 0.6rem 0.7rem; border-radius: 8px; border: 1px solid #21262d;
        background: #0d1117; color: #c9d1d9; font-family: inherit; font-size: 16px;
      }
      #admit-apply { width: 100%; margin-top: 0.6rem; }
      #admit-status { padding-top: 0.5rem; font-size: 0.88rem; min-height: 1.3rem; }
      @media (max-width: 560px) {
        main { margin: 2vh auto; }
        .row { flex-direction: column; gap: 0; }
        .row .k { min-width: 0; font-size: 0.8rem; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1><span class="glyph">🏛️</span> Lararium — browser vessel</h1>
      <p class="sub">a sovereign causal island, booting in your browser</p>

      <section class="panel">
        <h2>boot</h2>
        <div class="rows" id="phases"></div>
      </section>

      <section class="panel">
        <h2>vessel</h2>
        <div class="rows" id="vessel">
          <div class="row"><span class="k">status</span><span class="v" id="status">starting…</span></div>
        </div>
      </section>

      <section class="panel">
        <h2>identity &amp; admit</h2>
        <div class="rows">
          <div class="copyrow">
            <span class="val" id="vessel-key">…</span>
            <button id="copy-key" type="button">copy key</button>
          </div>
          <div class="copyrow">
            <span class="val" id="admit-cmd">…</span>
            <button id="copy-cmd" type="button">copy command</button>
          </div>
        </div>
        <div class="admit">
          <label for="admit-paste">paste the admit the node printed (the <code>#admit=…</code> line, its URL, or the JSON)</label>
          <textarea id="admit-paste" rows="4" spellcheck="false" autocapitalize="off" autocorrect="off"
                    placeholder="#admit=…"></textarea>
          <button id="admit-apply" type="button">admit this vessel</button>
          <div id="admit-status"></div>
        </div>
      </section>

      <section class="panel">
        <h2>@oracle read-face</h2>
        <div class="rows" id="oracle">
          <div class="row"><span class="k">status</span><span class="v" id="oracle-status">—</span></div>
        </div>
      </section>

      <section class="panel">
        <h2>projection — the live wiki
          <button id="summon-daemon" type="button" title="Summon the @daemon working surface (Ctrl+Shift+D)" disabled>☰ @daemon</button>
        </h2>
        <div id="projection"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

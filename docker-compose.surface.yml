# The SURFACE deployment: ONE vessel in the product image, on any host (Gaia parent/daughter, Linux box, Pi,
# VPS herm, Elyncia's portable figure). The image carries the executable spirit (daemon + CLI + genesis + web);
# everything that belongs to a household arrives as environment and two host mounts. Per-surface differences
# are ENVIRONMENT, never another file.
#
#   /state      one durable per-vessel host directory: the vessel's homes AND its custody (keys).
#               Back it up separately. It never rides an image layer, a build arg or an env var.
#   /workspace  the editable corpus (bags/, wikis/) the disk projection reads and writes.
#
# Required (no default, so a forgotten one fails loud instead of siting state in the wrong place):
#   LARES_STATE       host path mounted at /state      (put it on a LOCAL LINUX filesystem; on Win11 keep it
#                     inside the WSL distro, never /mnt/c — see the hazards below)
#   LARES_WORKSPACE   host path mounted at /workspace
# Optional:
#   LARES_UID / LARES_GID   the uid:gid the vessel runs as (default 1000:1000). Match the host operator, so
#                           files in both mounts stay editable from the host. CLI and daemon share it.
#   LARES_PORT        published relay/web port (default 4321)       LARES_BIND  host interface (default 127.0.0.1;
#                     set 0.0.0.0 or a LAN address to serve the house)
#   LARES_IMAGE       image reference (default lares-surface:local)  LAR_PUBLIC_URL  the REACHABLE face of this
#                     vessel (the name a browser or peer dials; HTTPS needs a WSS-capable name)
#   LAR_PEERS         pinned peers, `<url>#<gate key>` comma-separated (empty: a sovereign hearth alone)
#   LAR_LAN_DISCOVERY `announce` answers mDNS questions for `_lararium._tcp` with a bare service and port (empty: off).
#                     A candidate grants nothing; the gate key reaches a device by a carried admission. THE NETWORK
#                     DECIDES ITS REACH: on this file's bridge network an announcement reaches the containers of this
#                     compose project and nothing on the household LAN. Reaching the LAN takes host networking
#                     (`network_mode: host` in an override file: the container then shares the host's interfaces, the
#                     `ports:` map stops applying and LARES_BIND no longer fences the listener) or a macvlan/ipvlan
#                     attachment (needs a parent interface; the host itself usually cannot reach the container).
#                     Neither stands on by default. Without multicast, the admit's QR code or `lar:` URI carries
#                     the address.
#
# Optional household HTTPS slot (off by default): the operator supplies the domain and a DNS-01 wildcard
# certificate issued and renewed by an operator-owned tool outside this file, the host paths for its
# certificate and key, LARES_TLS_NAME (for example hearth.home.example.test), LARES_TLS_ZONE (for example
# home.example.test), LARES_LAN_ADDRESS, and a router DHCP setting that gives household devices the resolver's
# address. Stand it with `docker compose -f docker-compose.surface.yml --profile https up -d`. Set
# LAR_PUBLIC_URL=https://<LARES_TLS_NAME> and keep LARES_BIND on loopback. Both slot services publish on
# loopback until the operator names the LAN interface (LARES_TLS_BIND, LARES_DNS_BIND): a resolver published on
# every interface of a multi-homed host would forward for strangers. The terminator reaches `lares` on
# the compose network at lares:4321, never through its published port. No DNS credential or ACME client enters
# this file or any service. The resolver answers names under the zone with the LAN address and forwards all
# other names to LARES_DNS_UPSTREAM (default 1.1.1.1).
#
# THE ONE HOLDER LAW. One standing vessel owns the store at /state. The store takes its own claim at
# /state/.holder, a socket on the state mount, so a second container on the same /state refuses with StoreHeld
# through any entrypoint. Reach a standing vessel through exec; with none standing, the offline CLI door owns
# the store for one act and refuses by name if a vessel holds it. The CLI reports a needed re-stand while
# LAR_ENGINE=host leaves restart authority with the host shim. The standing vessel's CLI door is
#   docker compose -f docker-compose.surface.yml exec lares node packages/lares-cli/bin/lares.mjs <verb…>
# so the CLI shares the daemon's /tmp (the UDS rendezvous), uid and environment. The UDS lives in the
# container's own tmpfs /tmp: never bind it to the host, never share it between two containers, never put it
# on a Windows share (its claim hard-links a staging socket, which a 9P/SMB filesystem may refuse).
#
# FOUNDING is an offline act on the store:
#   docker compose -f docker-compose.surface.yml --profile offline run --rm offline vessel found --skip-build --root /state --genesis /app/genesis
# The founding gathers the human route (a passphrase and/or a paper pin) on a TTY: `run` attaches one when the
# host terminal has one, and `run -T`, a pipe or a detached `up` has none, so the CLI refuses by name
# (CredentialTtyRefusal). No flag and no env var carries a credential. After the founding, `lares vault status`,
# `unlock`, `bind` and `unbind` read theirs the same way, through the shim: `tools/lares-container.sh vault status`.
# The host shims (tools/lares-container.sh, tools/lares-container.ps1) wrap up, down, found, logs and the exec.
# The engine has no Docker socket and gets none: engine control stays with the host.
#
# WSL2/hosts: bind mounts from /mnt/c (9P) are slow and change ownership/metadata semantics; keep both mounts on
# ext4 inside the distro. Durability of the store rests on the host disk honoring fsync — a VM, network
# filesystem or controller cache can lie, and the daemon cannot tell.

name: lares-surface

x-vessel: &vessel
  image: ${LARES_IMAGE:-lares-surface:local}
  build:
    context: .
    dockerfile: Dockerfile
    target: serve
  user: "${LARES_UID:-1000}:${LARES_GID:-1000}"
  volumes:
    - type: bind
      source: ${LARES_STATE:?set LARES_STATE to the per-vessel state directory on the host}
      target: /state
    - type: bind
      source: ${LARES_WORKSPACE:?set LARES_WORKSPACE to the corpus directory on the host}
      target: /workspace
  # The explicit roots. The image bakes the same four; they are restated so a reader of THIS file sees the
  # contract. LAR_BAGS alone does not isolate the projection mirrors — the daemon also takes --root /workspace.
  environment: &roots
    LAR_ROOT: /state
    LAR_BAGS: /workspace/bags
    LAR_WIKIS: /workspace/wikis
    LAR_GENESIS: /app/genesis
    LAR_PORT: "4321"
    LAR_ENGINE: host
  # The UDS rendezvous (/tmp/lares-<uid>/…) stays INSIDE this container.
  tmpfs:
    - /tmp:mode=1777
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  # The standing vessel. Unprofiled: `docker compose up` stands it.
  lares:
    <<: *vessel
    environment:
      <<: *roots
      LAR_PUBLIC_URL: ${LAR_PUBLIC_URL:-http://localhost:${LARES_PORT:-4321}}
      LAR_PEERS: ${LAR_PEERS:-}
      LAR_LAN_DISCOVERY: ${LAR_LAN_DISCOVERY:-}
      # The relay, oracle and Web surface share the one HTTP origin this vessel serves; a vessel that leaves
      # its Web origin undeclared refuses to boot.
      LAR_SAME_ORIGIN: "true"
      # The Web shore and its finite receipt ride as two explicit inputs; copying the bytes alone never widens
      # Node's route ownership. Only a Lararium (a vessel with a lit face) mounts them — see `herm` below.
      LAR_PRONAOS_WEB_ROOT: /app/packages/lararium-web/dist
      LAR_PRONAOS_ARTIFACT_RECORD: /app/pronaos-build/pronaos-artifact.json
    command: ["--root", "/workspace", "--genesis", "/app/genesis"]
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - "${LARES_BIND:-127.0.0.1}:${LARES_PORT:-4321}:4321"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  # The offline CLI door owns the store for one act and refuses by name while a vessel stands.
  offline:
    <<: *vessel
    profiles: [offline]
    entrypoint: ["node", "packages/lares-cli/bin/lares.mjs"]
    stdin_open: true   # the route prompt reads the attached terminal; `run` allocates the TTY itself
    command: ["help"]
    restart: "no"

  # The VPS-herm surface: the same image standing wiki-less (the carriage crossroads). A herm handed any
  # LAR_PRONAOS_* input refuses to boot, so it is its own service. It takes the SAME /state as `lares` would, so
  # run ONE of the two (the one-holder law refuses the second); a host picks its surface by `up lares` or
  # `--profile herm up herm`.
  herm:
    <<: *vessel
    profiles: [herm]
    environment:
      <<: *roots
      LAR_RECIPE: herm
      LAR_HERM_RELAY_PORT: "8090"
      LAR_PUBLIC_URL: ${LAR_PUBLIC_URL:-http://localhost:${LARES_PORT:-4321}}
      LAR_PEERS: ${LAR_PEERS:-}
      LAR_LAN_DISCOVERY: ${LAR_LAN_DISCOVERY:-}
      LAR_SAME_ORIGIN: "true"
    command: ["--root", "/workspace", "--genesis", "/app/genesis"]
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - "${LARES_BIND:-127.0.0.1}:${LARES_PORT:-4321}:4321"
      - "${LARES_BIND:-127.0.0.1}:${LARES_RELAY_PORT:-8090}:8090"

  # The optional TLS edge. Host-supplied certificate files are read-only; the vessel remains plaintext on
  # the private compose network and keeps its published port on loopback.
  terminator:
    profiles: [https]
    image: ${LARES_TLS_IMAGE:-nginx:1.30-alpine}
    # The terminator runs as the vessel's own uid: the operator's key file stays readable by its owner alone, and
    # the listener binds an unprivileged port inside, so the service holds no capability at all.
    user: "${LARES_UID:-1000}:${LARES_GID:-1000}"
    # Each required value refuses BY NAME, here, when it stands empty. Compose interpolates every service whether
    # or not its profile runs, so a required-variable form in this slot would break the default `up`.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        refuse() { echo "household-https: $$1" >&2; exit 2; }
        [ -n "$$LARES_TLS_NAME" ] || refuse 'LARES_TLS_NAME stands unset — name the household host (for example hearth.home.example.test)'
        [ -n "$$LARES_TLS_CERT" ] || refuse 'LARES_TLS_CERT stands unset — supply the host path of the certificate file'
        [ -n "$$LARES_TLS_KEY" ]  || refuse 'LARES_TLS_KEY stands unset — supply the host path of the key file'
        [ -n "$$LARES_TLS_ZONE" ] || refuse 'LARES_TLS_ZONE stands unset — name the zone the resolver answers (for example home.example.test)'
        [ -n "$$LARES_LAN_ADDRESS" ] || refuse 'LARES_LAN_ADDRESS stands unset — give the LAN address the household name answers with'
        case "$$LARES_TLS_NAME" in *".$$LARES_TLS_ZONE") ;; *) refuse "LARES_TLS_NAME ($$LARES_TLS_NAME) lies outside LARES_TLS_ZONE ($$LARES_TLS_ZONE) — the resolver would never answer it" ;; esac
        printf '%s\n' "$$LARES_LAN_ADDRESS" | grep -Eq '^([0-9]{1,3}\.){3}[0-9]{1,3}$$' || refuse "LARES_LAN_ADDRESS ($$LARES_LAN_ADDRESS) reads as no IPv4 address"
        case "$$LARES_LAN_ADDRESS" in 0.*|127.*|255.*) refuse "LARES_LAN_ADDRESS ($$LARES_LAN_ADDRESS) names no device on the LAN" ;; esac
        exec nginx -g 'daemon off;'
    environment:
      LARES_TLS_NAME: ${LARES_TLS_NAME:-}
      LARES_TLS_CERT: ${LARES_TLS_CERT:-}
      LARES_TLS_KEY: ${LARES_TLS_KEY:-}
      LARES_TLS_ZONE: ${LARES_TLS_ZONE:-}
      LARES_LAN_ADDRESS: ${LARES_LAN_ADDRESS:-}
    # Healthy once the listener accepts. The resolver waits on this, so a slot that refused a value stands no half.
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8443"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "${LARES_TLS_BIND:-127.0.0.1}:${LARES_TLS_PORT:-443}:8443"
    volumes:
      - type: bind
        source: ${LARES_TLS_CERT:-/dev/null}
        target: /run/tls/tls.crt
        read_only: true
      - type: bind
        source: ${LARES_TLS_KEY:-/dev/null}
        target: /run/tls/tls.key
        read_only: true
    configs:
      - source: household-terminator-nginx-main
        target: /etc/nginx/nginx.conf
      - source: household-terminator-nginx
        target: /etc/nginx/conf.d/default.conf
    # Compose writes inline config content into the container's own filesystem at create, so the root filesystem
    # stays writable; the service holds no capability and no privilege to use that with.
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=16m,mode=1777
      - /var/run:rw,noexec,nosuid,size=4m,mode=1777
      - /var/log/nginx:rw,noexec,nosuid,size=4m,mode=1777
      - /tmp:rw,noexec,nosuid,size=8m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      - lares
    restart: unless-stopped

  # One split-horizon DNS answer for the household zone; every other question follows the configured upstream.
  resolver:
    profiles: [https]
    image: ${LARES_DNS_IMAGE:-coredns/coredns:1.12.1}
    # The CoreDNS image holds no shell, so it checks nothing itself: the terminator refuses an unset zone or LAN
    # address by name, and this service starts only once the terminator answers healthy.
    # Its binary carries the bind-service file capability, so the service runs as root holding that ONE capability
    # and no other; with new privileges forbidden, an exec that would have to GAIN it refuses.
    user: "0:0"
    command: ["-conf", "/etc/coredns/Corefile"]
    environment:
      LARES_TLS_ZONE: ${LARES_TLS_ZONE:-}
      LARES_LAN_ADDRESS: ${LARES_LAN_ADDRESS:-}
      LARES_DNS_UPSTREAM: ${LARES_DNS_UPSTREAM:-1.1.1.1}
    ports:
      - "${LARES_DNS_BIND:-127.0.0.1}:${LARES_DNS_PORT:-53}:1053/udp"
      - "${LARES_DNS_BIND:-127.0.0.1}:${LARES_DNS_PORT:-53}:1053/tcp"
    configs:
      - source: household-resolver-corefile
        target: /etc/coredns/Corefile
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      terminator:
        condition: service_healthy
    restart: unless-stopped

configs:
  household-terminator-nginx-main:
    content: |
      worker_processes auto;
      pid /var/run/nginx.pid;
      error_log /dev/stderr warn;
      events { worker_connections 1024; }
      http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        access_log /dev/stdout;
        sendfile on;
        keepalive_timeout 65;
        include /etc/nginx/conf.d/*.conf;
      }
  household-terminator-nginx:
    content: |
      # A request for any other name gets no certificate and no vessel: the handshake refuses.
      server {
        listen 8443 ssl default_server;
        ssl_reject_handshake on;
      }
      server {
        listen 8443 ssl;
        server_name ${LARES_TLS_NAME:-unset.invalid};
        ssl_certificate /run/tls/tls.crt;
        ssl_certificate_key /run/tls/tls.key;
        location / {
          proxy_pass http://lares:4321;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $$http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_set_header Host $$http_host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          # A relay socket rests idle between changes. The proxy's idle timers bound transport alone, at the edge
          # of the vessel: they decide no admission and no lapse, and a dropped socket simply dials again.
          proxy_read_timeout 1h;
          proxy_send_timeout 1h;
          # A carrier save may exceed the proxy's default body bound; the vessel sets its own.
          client_max_body_size 0;
        }
      }
  household-resolver-corefile:
    content: |
      .:1053 {
        errors
        template IN A ${LARES_TLS_ZONE:-unset.invalid} {
          match ^([^.]+\.)*${LARES_TLS_ZONE:-unset.invalid}\.$
          answer "{{ .Name }} 60 IN A ${LARES_LAN_ADDRESS:-192.0.2.1}"
          fallthrough
        }
        forward . ${LARES_DNS_UPSTREAM:-1.1.1.1}
      }

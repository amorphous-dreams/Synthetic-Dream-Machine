# docker-compose.swarm.yml — the DEPLOYED WHO-plane swarm: different PersonaGroups found +
# join a SHARED cabal-realm across REAL containers, the membership ceremony crossing a FILE
# channel over a shared VOLUME. Each vessel is its own container + its own Keyhive identity.
#
#   founder  (LAR_SWARM_ROLE=founder)  founds the place, opens each joiner's dwelling, verifies each
#                                      PRESENTED admit on ask
#   vessel-b (joiner) ─┐  offer contact-card over /swarm/channel → await admit → present it → await the verdict
#   vessel-c (joiner) ─┘
#
# Run:     docker compose -f docker-compose.swarm.yml up -d
# Witness: founder logs "held=2/2" and exits 0 (no roster stands; each party verifies on ask)
# Down:    docker compose -f docker-compose.swarm.yml down -v
#
# The vessels run compiled probes from the product image; ceremony and vessel homes use named volumes.

name: dreamnet-swarm

# Node services require the product image digest in LARES_HARNESS_IMAGE.

x-vessel: &vessel
  image: "${LARES_HARNESS_IMAGE:?name the built image by digest — tools/harness-image.sh prints it}"
  volumes:
    - "swarm-run:/workspace"      # the shared file channel
  networks: [swarm]
  restart: "no"
  entrypoint: ["node", "packages/lararium-node/dist/probes/swarm-node.js"]

services:
  founder:
    <<: *vessel
    volumes:
      - "swarm-run:/workspace"
      - "swarm-founder-state:/state"
    environment:
      LAR_ROOT: "/state"
      LAR_SWARM_ROLE:   "founder"
      LAR_SWARM_DIR:    "/workspace"
      LAR_SWARM_ID:     "founder"
      LAR_SWARM_SEED:   "f0"
      LAR_SWARM_EXPECT: "2"

  vessel-b:
    <<: *vessel
    volumes:
      - "swarm-run:/workspace"
      - "swarm-vessel-b-state:/state"
    environment:
      LAR_ROOT: "/state"
      LAR_SWARM_ROLE: "joiner"
      LAR_SWARM_DIR:  "/workspace"
      LAR_SWARM_ID:   "vessel-B"
      LAR_SWARM_SEED: "b0"
    depends_on: [founder]

  vessel-c:
    <<: *vessel
    volumes:
      - "swarm-run:/workspace"
      - "swarm-vessel-c-state:/state"
    environment:
      LAR_ROOT: "/state"
      LAR_SWARM_ROLE: "joiner"
      LAR_SWARM_DIR:  "/workspace"
      LAR_SWARM_ID:   "vessel-C"
      LAR_SWARM_SEED: "c0"
    depends_on: [founder]

volumes:
  swarm-run:
  swarm-founder-state:
  swarm-vessel-b-state:
  swarm-vessel-c-state:

networks:
  swarm:
    driver: bridge
